name: Release integrity

# Tagging and publishing are two separate steps in two separate workflows, and CI only confirms the
# TAG appeared ("Merged version is tagged"). Nothing confirmed the RELEASE appeared, so a version
# could exist as a tag, be announced in the CHANGELOG, and have no download behind it. That happened
# twice from different causes: a tag push rejected server-side with "fatal error in commit_refs", and
# a release run abandoned mid-flight during a GitHub Actions incident.
#
# Deliberately SCHEDULED and standalone rather than a step at the end of release.yml. Both real
# failures were runs that never finished, so a verification step inside the same run would have been
# abandoned along with everything else. A separate run on its own trigger is the only shape that
# notices.
#
# Daily, and once each release run is done with its release, whichever way it went: release.yml's last
# job starts this. Releases go out several times a day, and the in-app updater and every README download
# link read the Latest release, so a broken update path waited up to a week for the Monday run (#2805).
# A workflow_run trigger on Release never fired, because auto-release dispatches the release with
# GITHUB_TOKEN, and GitHub starts no run from an event that token caused, apart from a dispatch.
on:
  schedule:
    - cron: '0 7 * * *'   # every day at 07:00 UTC
  workflow_dispatch:
    inputs:
      after_run:
        description: "The Release run that started this check, which the wait below does not wait for"
        required: false
        default: ""

permissions:
  contents: read
  # The first step lists the Release and Auto-release runs that are still going.
  actions: read
  # gh attestation verify reads the release's provenance from the attestations API.
  attestations: read

jobs:
  verify:
    name: Every version tag has a release
    # Pinned like every Linux job here; auto-release.yml says why.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # tags are the whole point of this job

      # A release in flight has its CHANGELOG entry on main before auto-release pushes its tag, its tag
      # before its release, and its release before its assets, so checking then reports a gap that is
      # about to close. The Release run that ends it starts this workflow again, from its last job, so
      # that run is still going here and is the one run not waited for.
      - name: Wait out a release that is still publishing
        id: busy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER_RUN: ${{ inputs.after_run }}
        run: |
          set -euo pipefail
          # A dispatch input, so only a run id counts.
          if [[ -n "${AFTER_RUN}" && ! "${AFTER_RUN}" =~ ^[0-9]+$ ]]; then
            echo "::error::after_run is not a run id."
            exit 1
          fi
          running=0
          for wf in auto-release.yml release.yml; do
            n=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${wf}" --limit 20 --json databaseId,status \
              --jq "[.[] | select(.status != \"completed\" and (.databaseId | tostring) != \"${AFTER_RUN}\")] | length")
            echo "${wf} runs still going: ${n}"
            running=$((running + n))
          done
          if [ "${running}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A release is still publishing, so this run checks nothing; the run that ends it starts another."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare version tags against published releases
        if: steps.busy.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Five tags predate this check and have no release. They are listed rather than backfilled:
          # creating a release for an older tag steals the "Latest" badge, which GitHub assigns by
          # DATE and not by semver, so a backfill would have to re-assert --latest on the newest
          # release afterwards. Whether to backfill is tracked in the issue; this job's job is to
          # ensure the list never grows.
          KNOWN_GAPS="v0.13.6 v1.7.15 v1.52.75 v1.56.7 v1.65.9"

          git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort > /tmp/tags.txt

          # --paginate is load-bearing. A single default page returns 30 releases against 600+ tags,
          # which reports almost every version as missing — a first attempt at this comparison
          # produced exactly that useless list.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name' | sort > /tmp/releases.txt

          TAG_COUNT=$(wc -l < /tmp/tags.txt)
          REL_COUNT=$(wc -l < /tmp/releases.txt)
          echo "version tags: ${TAG_COUNT}   published releases: ${REL_COUNT}"

          # Vacuity floor: an auth failure or a renamed repo would leave both files empty and this
          # job would pass by comparing nothing against nothing.
          if [ "${TAG_COUNT}" -lt 100 ] || [ "${REL_COUNT}" -lt 100 ]; then
            echo "::error::Read back only ${TAG_COUNT} tags and ${REL_COUNT} releases. This repository has hundreds of both, so one of the two reads failed and this check proved nothing."
            exit 1
          fi

          MISSING=$(comm -23 /tmp/tags.txt /tmp/releases.txt || true)

          NEW_GAPS=""
          for tag in ${MISSING}; do
            case " ${KNOWN_GAPS} " in
              *" ${tag} "*) echo "known historical gap, ignored: ${tag}" ;;
              *) NEW_GAPS="${NEW_GAPS} ${tag}" ;;
            esac
          done

          # A known gap that has since been published should be removed from the list, or it hides a
          # real regression on that same tag later.
          for tag in ${KNOWN_GAPS}; do
            if grep -qxF "${tag}" /tmp/releases.txt; then
              echo "::warning::${tag} is listed as a known gap but now has a release. Remove it from KNOWN_GAPS in this workflow so the list stays honest."
            fi
          done

          if [ -n "${NEW_GAPS}" ]; then
            echo "::error::These version tags have no GitHub Release, so anyone following the tag or reading the CHANGELOG finds no download:${NEW_GAPS}. Publish the missing release (gh release create <tag> with the built assets), then re-assert the Latest badge on the newest release, since GitHub assigns it by date rather than by semver."
            exit 1
          fi

          echo "Every version tag outside the known historical gaps has a published release."

      # The next step checks the newest release's assets, and a release that loses its assets later is
      # no longer the newest by then: its page stays without a download while every check stays green.
      - name: Every release has its download
        if: steps.busy.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # v1.57.0 and v1.57.1 were withdrawn, and their names say "superseded". Releases up to 0.13.2
          # named the executable SysManager.exe, and the four earliest predate the checksum file.
          NO_CHECKSUM="v0.3.0 v0.4.0 v0.5.0 v0.5.1"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > /tmp/pages.json
          jq 'add' /tmp/pages.json > /tmp/releases.json
          COUNT=$(jq 'length' /tmp/releases.json)
          echo "published releases: ${COUNT}"
          if [ "${COUNT}" -lt 100 ]; then
            echo "::error::Read back only ${COUNT} releases. This repository has hundreds, so the read failed and this check proved nothing."
            exit 1
          fi

          jq -r --arg nochecksum " ${NO_CHECKSUM} " '
            .[]
            | select((.name // "") | test("superseded") | not)
            | .tag_name as $tag
            | ([.assets[] | {(.name): .size}] | add // {}) as $assets
            | (if $assets["SysManager-\($tag).exe"] then "SysManager-\($tag).exe"
               elif $assets["SysManager.exe"] then "SysManager.exe"
               else null end) as $exe
            | if $exe == null then "\($tag): no executable"
              elif $assets[$exe] < 10000000 then "\($tag): \($exe) is only \($assets[$exe]) bytes"
              elif $assets["\($exe).sha256"] == null and ($nochecksum | contains(" \($tag) ") | not)
                then "\($tag): no \($exe).sha256"
              else empty end' /tmp/releases.json > /tmp/broken.txt

          if [ -s /tmp/broken.txt ]; then
            echo "::error::$(wc -l < /tmp/broken.txt) release(s) lack the download a user fetches:"
            sed 's/^/  /' /tmp/broken.txt
            echo "Upload the missing assets with gh release upload, and check the SHA256 against the binary that release built."
            exit 1
          fi

          echo "Read ${COUNT} releases: each one not withdrawn carries its executable, and its checksum after the first four."

      - name: The newest CHANGELOG version has a release
        if: steps.busy.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The other half of the same failure: main can carry a version bump and a CHANGELOG entry
          # while neither the tag nor the release exists, which is what "main claimed 1.75.2 with no
          # tag and no release" looked like. Checked from the CHANGELOG rather than the csproj
          # because the CHANGELOG is the announcement a reader acts on.
          NEWEST=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          if [ -z "${NEWEST}" ]; then
            echo "::error::Could not read the newest version from CHANGELOG.md. If the heading format changed, update this check in the same PR."
            exit 1
          fi
          echo "newest CHANGELOG version: ${NEWEST}"

          if ! gh release view "v${NEWEST}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::CHANGELOG.md announces ${NEWEST} but there is no v${NEWEST} release. Either the auto-release tag push failed or the release run was abandoned; publish it by hand and check why the run did not finish."
            exit 1
          fi

          # Existing is not the same as usable. `gh release view` succeeds for a release with zero
          # assets, so a run that died after creating the release and before uploading leaves exactly
          # the outcome this workflow exists to catch — a reader follows the CHANGELOG and finds no
          # download — while every check above passes. The two names below are the ones the README
          # tells a user to fetch and verify.
          ASSETS=$(gh release view "v${NEWEST}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[] | "\(.name) \(.size)"')

          MISSING=""
          for name in "SysManager-v${NEWEST}.exe" "SysManager-v${NEWEST}.exe.sha256"; do
            if ! printf '%s\n' "${ASSETS}" | grep -qF "${name} "; then
              MISSING="${MISSING} ${name}"
            fi
          done

          if [ -n "${MISSING}" ]; then
            echo "::error::v${NEWEST} exists but is missing the assets a user downloads:${MISSING}. Re-run the release job's upload step, or upload them with gh release upload."
            exit 1
          fi

          # A zero-byte or truncated upload is the failure mode, so the floor is deliberately far below
          # the real size (~84 MB) rather than tracking it. Tracking it would go red the day the binary
          # legitimately slims down, which is not a release-integrity problem.
          EXE_SIZE=$(printf '%s\n' "${ASSETS}" | awk -v n="SysManager-v${NEWEST}.exe" '$1 == n { print $2 }')
          if [ "${EXE_SIZE:-0}" -lt 10000000 ]; then
            echo "::error::v${NEWEST}'s executable is only ${EXE_SIZE:-0} bytes, so the upload was truncated or empty. Re-upload it and verify the published SHA256 against the rebuilt binary."
            exit 1
          fi

          echo "v${NEWEST} is published with its executable (${EXE_SIZE} bytes) and checksum."

      # What the updater and the README rely on, which nothing compared: the in-app update reads
      # releases/latest and refuses a download whose hash differs from the .sha256 asset, the release
      # page carries an "Expected SHA256" line, and the README tells users to run gh attestation verify.
      - name: The newest version is Latest, and its download checks out
        if: steps.busy.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEWEST=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          TAG="v${NEWEST}"
          EXE="SysManager-${TAG}.exe"

          # One read of the Latest record, the one the updater reads, and everything below comes from it.
          # The by-tag view has served a release without its assets for hours (v1.112.9), and
          # gh release download and gh release view both resolve through it.
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > /tmp/latest.json

          # GitHub gives the Latest badge by date, not by version, so a backfill of an older tag takes it.
          LATEST=$(jq -r .tag_name /tmp/latest.json)
          if [ "${LATEST}" != "${TAG}" ]; then
            echo "::error::Latest is ${LATEST}, but the newest version is ${TAG}. The in-app update and the README links read Latest. Re-assert it: gh release edit ${TAG} --latest"
            exit 1
          fi

          mkdir -p /tmp/latest
          for name in "${EXE}" "${EXE}.sha256"; do
            ASSET=$(jq -r --arg n "${name}" '.assets[] | select(.name == $n) | .id' /tmp/latest.json)
            if [ -z "${ASSET}" ]; then
              echo "::error::The Latest release, ${TAG}, lists no ${name}, and the in-app update needs both the .exe and its .sha256."
              exit 1
            fi
            gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET}" \
              > "/tmp/latest/${name}"
          done
          ACTUAL=$(sha256sum "/tmp/latest/${EXE}" | cut -d' ' -f1)
          FILE=$(tr -d '\r' < "/tmp/latest/${EXE}.sha256" | cut -d' ' -f1 | tr 'A-F' 'a-f')
          PAGE=$(jq -r .body /tmp/latest.json \
            | grep -oP 'Expected SHA256: `\K[0-9A-Fa-f]{64}' | head -n 1 | tr 'A-F' 'a-f' || true)
          DIGEST=$(jq -r --arg n "${EXE}" '.assets[] | select(.name == $n) | .digest // ""' /tmp/latest.json \
            | sed 's/^sha256://')
          echo "downloaded ${ACTUAL}"
          echo ".sha256    ${FILE}"
          echo "page       ${PAGE}"
          echo "asset      ${DIGEST}"
          if [ "${FILE}" != "${ACTUAL}" ] || [ "${PAGE}" != "${ACTUAL}" ] || [ "${DIGEST}" != "${ACTUAL}" ]; then
            echo "::error::${TAG}'s hashes disagree, so the updater refuses the download or a user's check fails. Re-upload the binary the release built and its checksum, and correct the release page."
            exit 1
          fi

          if ! gh attestation verify "/tmp/latest/${EXE}" --repo "${GITHUB_REPOSITORY}"; then
            echo "::error::${EXE} does not verify against its build attestation, which is the check the README gives users."
            exit 1
          fi

          echo "${TAG} is Latest, its executable matches its checksum, its page and its asset digest, and it verifies."

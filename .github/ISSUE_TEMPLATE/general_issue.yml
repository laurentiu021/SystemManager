name: Report a bug or general issue
description: Report a crash, stability problem, unexpected behaviour, or anything else
title: "[Issue]: "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use this for anything that doesn't fit neatly into "bug with repro steps"
        or "feature request" — crashes, freezes, weird UI glitches, stability
        problems, or general issues you want to flag.

        **Never include passwords, tokens, or personal data.**

  - type: dropdown
    id: category
    attributes:
      label: What kind of issue is this?
      options:
        - Bug / unexpected behaviour
        - Crash / freeze / hang
        - Stability / performance
        - UI glitch
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SysManager version
      description: Shown at the top of the **About** tab, and at the bottom of the sidebar.
      placeholder: e.g. the version shown on the About tab
    validations:
      required: true

  - type: dropdown
    id: tab
    attributes:
      label: Which tab is affected?
      multiple: true
      options:
        - Dashboard
        - System Health
        - Windows Update
        - Performance Mode
        - Services
        - Startup Manager
        - Windows Features
        - Undo Changes
        - Restore Points
        - Task Scheduler
        - Boot Analyzer
        - System Fixes
        - Gaming Profile
        - Standby List Cleaner
        - Timer Resolution
        - CPU Core Affinity
        - Display Profiles
        - Process Manager
        - Resource History
        - Camera/Mic/Location
        - Settings Watchdog
        - Quick Cleanup
        - Deep Cleanup
        - Shortcut Cleaner
        - Scheduled Maintenance
        - Disk Analyzer
        - Large Files
        - Duplicate Finder
        - File Lock Detector
        - Ping
        - Traceroute
        - Speed Test
        - Bandwidth Monitor
        - Network Repair
        - DNS & Hosts
        - App Updates
        - Bulk Installer
        - New App Alerts
        - Uninstaller
        - Privacy & Telemetry
        - File Shredder
        - App Blocker
        - Preinstalled Apps
        - Browser Cleaner
        - Edge/OneDrive Remover
        - Defender Tweaks
        - Context Menu
        - Dark Mode Scheduler
        - Volume Control
        - Notification Blocker
        - Drivers
        - Battery Health
        - System Logs
        - System Report
        - Legacy Panels
        - About
        - Profile Export / Import
        - CLI Interface
        - Environment Variables
        - Multiple / general UI
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: What happened? What did you expect? Any pattern you noticed?
      placeholder: "The app freezes for ~10 seconds every time I switch to the Ping tab..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log excerpt (optional)
      description: |
        Logs are in `%LOCALAPPDATA%\SysManager\logs\`. Paste the relevant lines, or attach the file.
        **Save diagnostics bundle** on the About tab puts the newest logs, the system report and your
        environment info into one zip you can attach instead.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag and drop screenshots directly into this box.

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: I searched existing issues first.
          required: true

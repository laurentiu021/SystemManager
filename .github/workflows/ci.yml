name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The app sends nothing anywhere, and neither should the tools that build it. xUnit v3 test
# projects are Microsoft.Testing.Platform applications, and that platform ships a telemetry
# extension that is registered automatically and reads both of these; the SDK reads the second
# one. Set here rather than per-job so a new job cannot be added without them.
env:
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: windows-latest
    # 25, not 10. This job normally takes 5-8 minutes — the tests themselves are ~1 of those, the
    # rest is checkout, SDK setup, restore and four sequential builds — so a 10-minute ceiling left
    # only ~2 minutes of headroom. A slow runner then blew it, and a job killed by its timeout has
    # conclusion `cancelled`, which `gh pr checks` renders as `fail`: indistinguishable from a real
    # test failure, while the log still says "Passed! Failed: 0". That happened three times on
    # 2026-08-06 and left a PR blocked for days over nothing. A ceiling is here to catch a HUNG job,
    # and 25 minutes still does that. (ui-tests below already allows 30 for a ~4-minute job.)
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are needed by "Check the version is the one the merge will tag" below, which
          # compares the PR's version against a bump from the newest tag. A shallow clone carries no
          # tags, so that check would silently pass against nothing.
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The key must hash every file that decides WHICH packages get restored. Under central package
      # management a .csproj carries no versions at all — they are all in Directory.Packages.props, and
      # Directory.Build.props adds a PackageReference of its own (Microsoft.SourceLink.GitHub). Hashing
      # only .csproj therefore misses every version change.
      #
      # The failure is quiet rather than wrong: an unchanged key is an exact hit, actions/cache skips the
      # save, and restore downloads the new version anyway. But it is never cached, so it is re-downloaded
      # on every run until some unrelated .csproj edit rotates the key. Dependabot's grouped version bumps
      # are precisely this shape, so it accumulates.
      #
      # global.json is intentionally absent: it pins the SDK, not the package set, and actions/setup-dotnet
      # already governs that in the step above.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore SysManager/SysManager/SysManager.csproj
          dotnet restore SysManager/SysManager.Tests/SysManager.Tests.csproj
          dotnet restore SysManager/SysManager.IntegrationTests/SysManager.IntegrationTests.csproj
          dotnet restore SysManager/SysManager.UITests/SysManager.UITests.csproj

      # Format-check every C# project the workflow builds, not just the main one —
      # the same .editorconfig governs the test projects, so otherwise their style
      # could drift past CI silently.
      #
      # `shell: bash` with an explicit failure sweep, NOT four bare lines. A multi-line `run:` uses the
      # default shell, where only the LAST command's exit code decides the step — so a project that
      # failed formatting printed its errors as annotations and the step still went green. That is how
      # five real violations (DuplicateFileViewModelTests, DarkModeViewModelTests, AboutViewModel)
      # reached main across several PRs while every run looked clean: the UITests project happened to
      # pass last. Each project's status is now captured and the step fails if ANY of them did.
      - name: Check formatting
        shell: bash
        run: |
          failed=""
          for proj in \
            SysManager/SysManager/SysManager.csproj \
            SysManager/SysManager.Tests/SysManager.Tests.csproj \
            SysManager/SysManager.IntegrationTests/SysManager.IntegrationTests.csproj \
            SysManager/SysManager.UITests/SysManager.UITests.csproj
          do
            if ! dotnet format "$proj" --verify-no-changes --verbosity diagnostic; then
              failed="$failed $proj"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Formatting violations in:$failed — run 'dotnet format <project>' to fix."
            exit 1
          fi
          echo "All four projects are correctly formatted."

      # The release workflow derives its notes from the CHANGELOG section matching the TAG that
      # auto-release computed from the commit type (feat: -> minor, fix: -> patch). If the csproj
      # version and the newest CHANGELOG header disagree with that bump, the release fails after the
      # tag is already pushed — leaving a tag with no release. Catch the mismatch here, on the PR,
      # where it costs one edit instead of a stuck release.
      - name: Check version consistency
        shell: pwsh
        run: |
          $csproj = Select-Xml -Path SysManager/SysManager/SysManager.csproj -XPath '//Version' |
                    Select-Object -First 1 -ExpandProperty Node | Select-Object -ExpandProperty '#text'
          $file = Select-Xml -Path SysManager/SysManager/SysManager.csproj -XPath '//FileVersion' |
                  Select-Object -First 1 -ExpandProperty Node | Select-Object -ExpandProperty '#text'
          $asm = Select-Xml -Path SysManager/SysManager/SysManager.csproj -XPath '//AssemblyVersion' |
                 Select-Object -First 1 -ExpandProperty Node | Select-Object -ExpandProperty '#text'

          # The three csproj versions must agree (FileVersion/AssemblyVersion carry a 4th component).
          if ($file -ne "$csproj.0") { throw "FileVersion ($file) does not match Version ($csproj)." }
          if ($asm -ne "$csproj.0") { throw "AssemblyVersion ($asm) does not match Version ($csproj)." }

          # A code-signing attribution must never be published before a certificate exists. The README
          # and the release-notes template both carried "Free code signing provided by SignPath.io,
          # certificate by SignPath Foundation" in the present tense while no certificate had been
          # issued — the Foundation had in fact declined the application. It reached 22 published
          # release pages before anyone noticed, because the release template reproduces it every time.
          # Claiming a sponsor that has not accepted you is a credibility problem, not a typo, so the
          # claim is now blocked mechanically rather than trusted to review.
          #
          # When a certificate IS issued: delete this gate in the same PR that adds the attribution.
          # That is the intended way out, and it makes the gate self-documenting rather than an
          # obstacle someone works around.
          $signingClaim = 'code signing provided by|certificate by \[?SignPath'
          foreach ($file in @('README.md', '.github/workflows/release.yml')) {
              $hit = Select-String -Path $file -Pattern $signingClaim
              if ($hit) {
                  throw "$file line $($hit[0].LineNumber) states a code-signing provider as fact: " +
                        "'$($hit[0].Line.Trim())'. No certificate is in place, so this must not be " +
                        "published. Remove the claim, or delete this gate in the same PR that adds a " +
                        "real certificate."
              }
          }
          Write-Host "No premature code-signing attribution found."

          # The release-notes footer that release.yml appends must be ASCII-only, and release.yml
          # enforces that AT RELEASE TIME — which is too late: the check runs after the merge, so a
          # single em dash in that template failed the v1.64.8 release and shipped no binary at all.
          # The rule is now also checked here, on the pull request, where a violation is a red check
          # instead of a missing release. Only the appended footer is constrained; the CHANGELOG body
          # the notes are built from keeps its punctuation.
          $releaseYml = Get-Content '.github/workflows/release.yml'
          $start = ($releaseYml | Select-String -Pattern '^\s*\$template = @''' | Select-Object -First 1)
          if (-not $start) {
              throw "Could not find the release-notes template in .github/workflows/release.yml. " +
                    "If it was renamed, update this gate in the same PR."
          }
          $end = $releaseYml |
              Select-String -Pattern "^\s*'@\s*$" |
              Where-Object { $_.LineNumber -gt $start.LineNumber } |
              Select-Object -First 1
          if (-not $end) { throw "The release-notes template is not terminated; check release.yml." }

          $footer = $releaseYml[$start.LineNumber..($end.LineNumber - 2)]
          $offenders = @()
          for ($i = 0; $i -lt $footer.Count; $i++) {
              foreach ($m in [regex]::Matches($footer[$i], '[^\x00-\x7F]')) {
                  $offenders += "release.yml line $($start.LineNumber + $i + 1): '$($m.Value)'"
              }
          }
          if ($offenders.Count -gt 0) {
              throw "The appended release-notes footer must be ASCII-only (release.yml enforces this " +
                    "at release time, which fails the release instead of the PR). Found: " +
                    ($offenders -join '; ')
          }
          if ($footer.Count -lt 20) {
              throw "Only $($footer.Count) template lines were scanned; the gate is not reading the " +
                    "real footer. Fix the gate rather than trusting the pass."
          }
          Write-Host "Release-notes footer is ASCII-only ($($footer.Count) lines scanned)."

          # The newest CHANGELOG entry must be for that same version, or the release step that reads
          # release notes out of the CHANGELOG finds nothing.
          $head = (Select-String -Path CHANGELOG.md -Pattern '^## \[([0-9]+\.[0-9]+\.[0-9]+)\]' |
                   Select-Object -First 1).Matches[0].Groups[1].Value
          if ($head -ne $csproj) {
              throw "csproj Version ($csproj) and the newest CHANGELOG entry ($head) disagree. " +
                    "A feat: PR bumps the MINOR component and a fix: PR the PATCH — set both to the " +
                    "version the merge will actually tag."
          }
          # SECURITY.md names the supported minor line. It is prose, so nothing recomputes it and it
          # drifted three minors behind (it still said 1.61.x at 1.64.0) — on the page that decides
          # whether someone bothers to report a vulnerability at all, and where a user on a NEWER build
          # reads their own version as unsupported. Only the MINOR line is checked: patch releases are
          # frequent and must not each require a docs edit.
          $minor = ($csproj -split '\.')[0..1] -join '.'
          $supported = (Select-String -Path SECURITY.md -Pattern '^\|\s*([0-9]+\.[0-9]+)\.x\s*\|' |
                        Select-Object -First 1).Matches[0].Groups[1].Value
          if ($supported -ne $minor) {
              throw "SECURITY.md says $supported.x is supported but this release is $csproj. " +
                    "Update the supported-versions table to $minor.x — a user on the current build " +
                    "must not read their own version as unsupported."
          }

          Write-Host "Version $csproj is consistent across csproj, CHANGELOG and SECURITY.md."

      # The check above proves csproj and CHANGELOG agree with EACH OTHER. It does not prove they agree
      # with the version the merge will actually tag — a different number, computed by auto-release as a
      # bump from the newest TAG, not from whatever the files say.
      #
      # That gap stranded two versions on 2026-08-11. Several fix: PRs were open at once; each resolved
      # its CHANGELOG conflict by taking the next free number, so main ended up carrying entries for
      # 1.61.4 and 1.61.6 while the newest tag was still v1.61.2. Auto-release computed 1.61.3, found no
      # entry for it, and refused — twice. Its own guard worked (no tag was created, so nothing was left
      # half-published), but the cost landed AFTER the merge and the remedy was another PR.
      #
      # Checking it here turns that into one edit on the PR. Mirrors auto-release's arithmetic
      # deliberately — same tag selection, same bump rules — so the two cannot drift apart on what
      # "next" means.
      - name: Check the version is the one the merge will tag
        shell: bash
        run: |
          set -o pipefail

          MATCHES=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          TAG=${MATCHES%%$'\n'*}
          if [ -z "$TAG" ]; then
            echo "No release tag found — nothing to compute a bump from, skipping."
            exit 0
          fi

          CSPROJ=$(grep -oPm1 '(?<=<Version>)[^<]+' SysManager/SysManager/SysManager.csproj)
          IFS='.' read -r MAJOR MINOR PATCH <<< "${TAG#v}"

          # A PR's commit type is not reliably available here, so accept ANY of the three legal bumps
          # rather than guessing. That still catches the real failure: a version that is not a single
          # bump from the newest tag, which is exactly what "1.61.6 while the tag is v1.61.2" was.
          PATCH_NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          MINOR_NEXT="${MAJOR}.$((MINOR + 1)).0"
          MAJOR_NEXT="$((MAJOR + 1)).0.0"

          if [ "$CSPROJ" = "$PATCH_NEXT" ] || [ "$CSPROJ" = "$MINOR_NEXT" ] || [ "$CSPROJ" = "$MAJOR_NEXT" ]; then
            echo "Version $CSPROJ is a valid bump from $TAG."
            exit 0
          fi

          # Unchanged is fine: docs:/test:/ci:/chore: PRs do not release, so they never touch it.
          if [ "$CSPROJ" = "${TAG#v}" ]; then
            echo "Version $CSPROJ equals the newest tag — no release expected from this PR."
            exit 0
          fi

          echo "::error::Version $CSPROJ is not what this merge will tag. The newest tag is $TAG, so auto-release will compute $PATCH_NEXT (fix:), $MINOR_NEXT (feat:) or $MAJOR_NEXT (breaking). Set csproj Version AND the newest CHANGELOG header to whichever applies. If another PR merged first and took your number, re-resolve against main rather than picking the next free one — a gap makes auto-release fail after the merge instead of before it."
          exit 1

      # The release workflow copies the matching CHANGELOG block VERBATIM into the release body and the
      # auto-posted announcement, so whatever that entry starts with is the first thing a prospective
      # user reads. When the friendly lead was a manual afterthought, five of the biggest feature
      # releases (1.53.0, 1.54.0, 1.55.0, 1.55.1, 1.56.0) shipped opening with a bare semver heading
      # followed by engineering prose — the ones a newcomer is most likely to open.
      #
      # Checked on the PR rather than at release time for the same reason as the version check above:
      # here it costs one edit, there it blocks a release after the tag is already pushed. The release
      # workflow keeps its own copy of this guard as the backstop, since a release can be dispatched
      # manually without passing through this job.
      - name: Check the newest CHANGELOG entry has a plain-English lead
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $head = [regex]::Match($changelog, '(?ms)^## \[(?<ver>[0-9]+\.[0-9]+\.[0-9]+)\].*?(?=^## \[|\z)')
          if (-not $head.Success) { throw "No versioned '## [x.y.z]' entry found in CHANGELOG.md." }

          $version = $head.Groups['ver'].Value
          $afterHeader = ($head.Value -split "(?m)^## \[.*$", 2)[1]
          $beforeFirstCategory = ($afterHeader -split "(?m)^### ", 2)[0]
          # Only real prose counts — blank lines and horizontal rules do not. @() keeps this an array
          # even for a one-line lead, which PowerShell would otherwise unwrap to a bare string.
          $leadLines = @($beforeFirstCategory -split "`r?`n" |
              Where-Object { $_.Trim() -ne "" -and $_.Trim() -notmatch "^(-{3,}|\*{3,}|_{3,})$" })

          if ($leadLines.Count -eq 0) {
              # Built by joining rather than with a here-string: PowerShell requires a here-string's
              # body and its closing "@ at column 0, which terminates the YAML block scalar this script
              # lives in. The two are incompatible, and the result is a workflow that will not parse.
              $msg = @(
                  "The CHANGELOG entry for $version has no plain-English lead."
                  ""
                  "Add one or two sentences directly under the '## [$version]' header, BEFORE the first"
                  "'###' category, describing what changed in the words a user would use. The release"
                  "workflow copies this entry verbatim, so that paragraph becomes the opening line of"
                  "the release page and of the announcement discussion."
                  ""
                  "Example:"
                  ""
                  "  ## [$version] - <date>"
                  ""
                  "  Quick Tune-Up now shows you what it found, instead of throwing the results away."
                  ""
                  "  ### Fixed"
                  "  - ..."
              ) -join [Environment]::NewLine
              throw $msg
          }
          Write-Host "CHANGELOG entry for $version opens with a lead ($($leadLines.Count) line(s))."

      - name: Build (Release)
        run: dotnet build SysManager/SysManager/SysManager.csproj -c Release --no-restore

      - name: Build tests
        run: dotnet build SysManager/SysManager.Tests/SysManager.Tests.csproj -c Release --no-restore

      # Compile-check the integration tests so ViewModel/service signature drift is
      # caught in CI. They are NOT run here (they touch the live system); compilation
      # alone catches the constructor/property mismatches that previously slipped by.
      - name: Build integration tests (compile check)
        run: dotnet build SysManager/SysManager.IntegrationTests/SysManager.IntegrationTests.csproj -c Release --no-restore

      # DIAGNOSING A RED CHECK HERE: read the failure summary at the end of this step's log first.
      # If it reports zero failures, the tests passed and the JOB was killed — either by the timeout
      # above or by a transient GitHub failure ("Failed to resolve action download info"). A killed
      # job's conclusion is `cancelled`, which `gh pr checks` displays as `fail`, so it looks identical
      # to a broken test. The fix in that case is `gh run rerun <id> --failed`, not a code change.
      #
      # Microsoft.Testing.Platform arguments, not VSTest ones — the test projects are MTP applications
      # and the .NET 10 SDK refuses to run those through VSTest at all, so global.json opts `dotnet
      # test` into the MTP command. The reports are xunit.v3's own, which is why there is no separate
      # TRX/JUnit logger package any more.
      #
      # --minimum-expected-tests is the floor that used to have no equivalent: the runner itself fails
      # the run when fewer tests execute than that, so a change that stops DISCOVERING tests can no
      # longer pass as a green run of nothing. 5000 against a real count of ~5160 leaves room to delete
      # a class without editing CI, while still catching any collapse.
      - name: Run unit tests
        run: >
          dotnet test --project SysManager/SysManager.Tests/SysManager.Tests.csproj
          -c Release --no-build
          --results-directory TestResults
          --minimum-expected-tests 5000
          --report-xunit-trx --report-xunit-trx-filename unit-results.trx
          --report-xunit-junit --report-xunit-junit-filename unit-results.junit.xml
          --coverage --coverage-output-format cobertura
          --coverage-output unit-coverage.cobertura.xml

      # Skip Codecov on fork PRs: forked pull requests have no access to repository
      # secrets, so CODECOV_TOKEN is empty there and the upload would fail noisily for
      # no benefit. Same-repo pushes/PRs upload normally.
      - name: Upload coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false

      # The same argument as the JUnit guard below, applied to the other artifact. The upload step
      # above discovers the coverage report by searching, and it is configured not to fail the build
      # when it finds nothing, so a run that stopped producing coverage would look exactly like a run
      # that produced it — the badge would simply stop moving. Checked after the upload for the same
      # reason that one is: a failing step skips what follows, and a coverage problem is no reason to
      # lose the test-results upload too.
      - name: Verify a coverage report was produced
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mapfile -t reports < <(find TestResults -name "*.cobertura.xml" -size +1k 2>/dev/null)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::no *.cobertura.xml over 1 KB under TestResults, so nothing was uploaded to Codecov and the coverage number is stale. Written instead:"
            find TestResults -type f 2>/dev/null || ls -la
            exit 1
          fi
          for report in "${reports[@]}"; do
            echo "coverage report: $report ($(wc -c < "$report") bytes)"
          done

      # Codecov's test-analytics parser reads JUnit XML and nothing else. A TRX is accepted by the CLI,
      # uploaded, and discarded server-side without a word, which is how the upload step below stayed
      # green for months while the Tests tab held zero tests (the test-analytics API returned
      # `{"count":0,"results":[]}`). Nothing checked what was being handed over, so now this does.
      #
      # The case floor is the part that matters. Existence and a well-formed root would both pass on an
      # empty report, so a logger that silently stops recording would look identical to a healthy run.
      #
      # Sits after the coverage upload on purpose: a failing step skips the ones that follow, and a
      # malformed test report is no reason to lose the coverage number too.
      - name: Verify the JUnit report before uploading it
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          report=TestResults/unit-results.junit.xml
          if [ ! -s "$report" ]; then
            echo "::error::$report is missing or empty, so there is nothing Codecov can parse. Written instead:"
            ls -la TestResults || true
            exit 1
          fi
          if ! grep -q "<testsuites" "$report"; then
            echo "::error::$report has no <testsuites> root, so Codecov will drop it silently. First 400 bytes:"
            head -c 400 "$report"
            exit 1
          fi
          cases=$({ grep -o "<testcase " "$report" || true; } | wc -l)
          echo "JUnit report: $(wc -c < "$report") bytes, $cases test cases."
          if [ "$cases" -lt 4000 ]; then
            echo "::error::the JUnit report holds only $cases test cases, under the floor of 4000. Either the run was truncated or the junit logger stopped recording; a report this small would upload cleanly and tell Codecov nothing."
            exit 1
          fi

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: TestResults/unit-results.junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: TestResults/**
          retention-days: 14

  # Catches a version that was never tagged — otherwise INVISIBLE. auto-release.yml serialises on a
  # concurrency group, and GitHub keeps only ONE pending run per group, so merging two
  # release-triggering PRs in close succession can displace the older queued run. A displaced run
  # reports as `cancelled`, not failed, so the bump is silently dropped: main ends up claiming a
  # version that has no tag and no release, with nothing red anywhere. That happened on the #1717
  # merge (1.57.6) and took manual archaeology to find.
  #
  # A separate job on purpose, not a step in build-and-test: it waits for auto-release, which runs in
  # parallel on the same push, and adding minutes of waiting to a job that already runs ~8 of its
  # 10-minute budget would make CI fail for timing rather than for correctness. ubuntu-latest because
  # this is git-only work.
  tag-published:
    name: Merged version is tagged
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # main only: on a PR, csproj is SUPPOSED to be ahead of the newest tag — that is the point of
    # bumping it in the PR. It is only a defect once the merge has landed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tags are the whole point of this job

      - name: Wait for the tag that matches csproj
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oE '<Version>[^<]+' SysManager/SysManager/SysManager.csproj | head -n1 | sed 's/<Version>//')
          echo "csproj version: $VERSION"

          # A chore:/docs:/ci:/test: merge does not release, so csproj legitimately still points at
          # the version already tagged by the previous release-triggering merge. Only a MISSING tag
          # for the current csproj version is a problem, which is exactly what this checks.
          for attempt in $(seq 1 10); do
            git fetch --tags --quiet origin
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "v$VERSION is tagged."
              exit 0
            fi
            echo "attempt $attempt: v$VERSION not tagged yet, waiting for auto-release..."
            sleep 30
          done

          NEWEST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          echo "::error::csproj is at $VERSION but there is no v$VERSION tag (newest is $NEWEST). Auto-release did not tag this merge — check whether its run was CANCELLED rather than failed (a displaced queued run reports as cancelled). Recover with: git tag -a v$VERSION -m \"SysManager $VERSION\" <merge-sha> && git push origin v$VERSION — release.yml triggers on v*.*.* and publishes normally."
          exit 1

  ui-tests:
    name: UI automation tests
    runs-on: windows-latest
    needs: build-and-test
    timeout-minutes: 30
    # UI tests need a desktop session; windows-latest provides one.
    # Skip on PRs from forks, since secrets won't be available anyway.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore SysManager/SysManager/SysManager.csproj
          dotnet restore SysManager/SysManager.UITests/SysManager.UITests.csproj

      # The UI tests launch the real app, so the app itself must be built first.
      # Without this the fixture finds no SysManager.exe and every UI test errors
      # at setup — which the previous Release-only job masked behind continue-on-error.
      - name: Build app (Release)
        run: dotnet build SysManager/SysManager/SysManager.csproj -c Release --no-restore

      - name: Build UI tests
        run: dotnet build SysManager/SysManager.UITests/SysManager.UITests.csproj -c Release

      - name: Run UI tests
        id: ui-tests
        run: >
          dotnet test --project SysManager/SysManager.UITests/SysManager.UITests.csproj
          -c Release --no-build
          --results-directory TestResults
          --report-xunit-trx --report-xunit-trx-filename ui-results.trx
        continue-on-error: true

      # Surface UI test failures as a visible warning annotation. Use `outcome`,
      # NOT `conclusion`: with continue-on-error the step's `conclusion` is forced to
      # 'success', so a `conclusion == 'failure'` check never fires and the failure is
      # masked entirely. `outcome` reflects the real step result before continue-on-error
      # is applied.
      # WHICH kind of failure, not just that there was one. See the integration job's copy of this step
      # for the run that made it necessary; the same wording covered both cases there and sent a reader
      # looking for a broken test that did not exist.
      - name: Annotate UI test failures
        if: ${{ steps.ui-tests.outcome == 'failure' && !cancelled() }}
        shell: bash
        run: |
          report=TestResults/ui-results.trx
          if [ ! -s "$report" ]; then
            echo "::warning::The UI run failed and wrote no TRX, so not even the test count is known. Review the ui-test-results artifact."
            exit 0
          fi
          cases=$({ grep -o "<UnitTestResult " "$report" || true; } | wc -l | tr -d ' ')
          passed=$({ grep -o '<UnitTestResult [^>]*outcome="Passed"' "$report" || true; } | wc -l | tr -d ' ')
          if [ "$passed" -lt "$cases" ]; then
            echo "::warning::$((cases - passed)) of $cases UI tests did not pass. This job is non-blocking, so the merge is not gated; the failure is still real. Review the ui-test-results artifact."
          else
            echo "::warning::All $cases UI tests PASSED and the run still exited non-zero, so this is an infrastructure or teardown failure rather than a test failure. Do not go looking for a broken test. Review the ui-test-results artifact."
          fi

      # A test that FAILS is a warning here, on purpose. A test that is never RUN is an error, and the
      # two are not the same finding: a failure means the job worked and found something, while a
      # collapsed count means this job's green says nothing at all. Nothing distinguished them until
      # now, so a runner or package change that stopped finding tests would have looked like a clean
      # pass. The floor sits between the 64 test METHODS in the project and the 136 cases they expand
      # to, so it catches theory rows silently stopping being enumerated as well as an outright
      # truncation, while leaving room for tests to be legitimately deleted.
      #
      # Counted from the report rather than with the runner's own --minimum-expected-tests, which is
      # what the blocking unit job uses: the step above is deliberately continue-on-error, so the
      # runner's exit code is discarded there and a floor enforced by it would arrive as a warning
      # alongside the ordinary failures it is supposed to be distinguished from. The floor has to live
      # in a step that can fail.
      - name: Verify the UI suite actually ran
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          report=TestResults/ui-results.trx
          if [ ! -s "$report" ]; then
            echo "::error::$report is missing or empty, so no UI test result was recorded at all. Written instead:"
            ls -la TestResults || true
            exit 1
          fi
          cases=$({ grep -o "<UnitTestResult " "$report" || true; } | wc -l)
          echo "TRX report: $(wc -c < "$report") bytes, $cases test results."
          if [ "$cases" -lt 100 ]; then
            echo "::error::the UI suite recorded only $cases results, under the floor of 100. Tests stopped being discovered rather than failing, so this job's result is meaningless."
            exit 1
          fi

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-test-results
          path: TestResults/**
          retention-days: 14

  # The integration suite was compile-checked and never EXECUTED anywhere in the pipeline, and the
  # primary workstation cannot run `dotnet test` at all. So a stale expectation in it stayed invisible
  # indefinitely: nine assertions sat red through a whole rename because compiling them still worked,
  # and one asserted a sidebar tab that had stopped being last. Both were found by reading the file,
  # which is not a process.
  #
  # Non-blocking, deliberately, and shaped exactly like ui-tests above: these tests touch the live
  # system (WMI, the filesystem, real processes), so a runner difference must not gate a merge. What
  # they must do is SPEAK — the warning annotation below is the whole point of the job, and the
  # session-start health check reads recent runs, so a red surfaces without anyone remembering to look.
  #
  # It spoke immediately. The first run found five failures and a hang, none of which anything in the
  # pipeline could have reported before, because the suite was compile-checked and never executed:
  #   WindowsUpdateAutoCheckTests.CommandExists(propName: "ListFeatureUpdatesCommand")
  #   EventLogServiceTests.Read_SeverityFilter_ReturnsOnlyRequested
  #   EventLogServiceTests.Read_System_ReturnsSomeEntries_Within_ShortWindow
  #   EventLogServiceTests.Read_EntriesEnrichedWithExplanation
  #   DeepCleanupViewUiTests.View_BindsToDeepCleanupViewModel  (Cannot find resource named 'Display')
  # then silence from 00:07:41 to the 30-minute ceiling. So this job starts red on purpose: the failures
  # are real and are being fixed, and a job that hid them would be the thing worth deleting.
  #
  # This is the broader of the two answers the issue proposed. Moving the project's pure assertions
  # into the blocking unit suite is still worth doing and does not conflict; it just cannot cover the
  # tests that genuinely need a live system, which this does.
  integration-tests:
    name: Integration tests (non-blocking)
    runs-on: windows-latest
    needs: build-and-test
    timeout-minutes: 30
    # Fork PRs have no secrets and no reason to run a live-system suite.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore SysManager/SysManager/SysManager.csproj
          dotnet restore SysManager/SysManager.IntegrationTests/SysManager.IntegrationTests.csproj

      - name: Build integration tests
        run: dotnet build SysManager/SysManager.IntegrationTests/SysManager.IntegrationTests.csproj -c Release --no-restore

      # Hang detection is not optional here, it is the whole reason this job is usable. The first run of this
      # job proved the suite HANGS on a clean runner: it reported five failures in the first eight minutes and
      # then produced no output at all for twenty-one, until the job's own 30-minute ceiling cancelled it. A
      # cancelled job reports `cancelled`, which `gh pr checks` renders as `fail` — indistinguishable from a
      # broken pipeline, and permanently red, which is how a non-blocking job teaches everyone to ignore it.
      #
      # With a hang timeout, the run stops at five minutes of silence, NAMES the test that stopped responding,
      # and writes a dump next to the results. A hang becomes a finding instead of a timeout.
      # --hangdump replaces VSTest's --blame-hang, and --xunit-diagnostics is what makes the NAMING
      # half work: the dump alone says a hang happened, while xunit.runner.json's
      # longRunningTestSeconds reports WHICH test stopped responding, and those are diagnostic
      # messages that are hidden unless diagnostics are on. The threshold sits below the dump timeout
      # on purpose, so the name is already in the log by the time the dump lands.
      - name: Run integration tests
        id: integration-tests
        run: >
          dotnet test --project SysManager/SysManager.IntegrationTests/SysManager.IntegrationTests.csproj
          -c Release --no-build
          --results-directory TestResults
          --hangdump --hangdump-timeout 5m
          --xunit-diagnostics on
          --report-xunit-trx --report-xunit-trx-filename integration-results.trx
        continue-on-error: true

      # `outcome`, NOT `conclusion`: continue-on-error forces the step's conclusion to 'success', so a
      # conclusion check never fires and the failure is masked completely. Same trap as ui-tests.
      #
      # And WHICH kind of failure, because this step used to say "Integration tests failed" for both of
      # them. On 2026-09-09 it said exactly that on a run where all 625 tests PASSED and the hang-dump
      # extension's own DisposeAsync threw during teardown (#2195), and again forty minutes later on a run
      # where one test genuinely failed (#2206). Identical wording, opposite meanings: the first sends a
      # reader hunting a broken test that does not exist, and once that has happened the annotation stops
      # being believed for the second. The TRX knows the difference — read it rather than guessing.
      #
      # `grep -o … | wc -l`, never `grep -c`: the TRX puts every <UnitTestResult> on one line, so a line
      # count returns 1 for a suite of 625. The outcome match is scoped inside the element because
      # <ResultSummary> carries an `outcome` attribute of its own.
      - name: Annotate integration test failures
        if: ${{ steps.integration-tests.outcome == 'failure' && !cancelled() }}
        shell: bash
        run: |
          report=TestResults/integration-results.trx
          if [ ! -s "$report" ]; then
            echo "::warning::The integration run failed and wrote no TRX, so not even the test count is known. Review the integration-test-results artifact."
            exit 0
          fi
          cases=$({ grep -o "<UnitTestResult " "$report" || true; } | wc -l | tr -d ' ')
          passed=$({ grep -o '<UnitTestResult [^>]*outcome="Passed"' "$report" || true; } | wc -l | tr -d ' ')
          if [ "$passed" -lt "$cases" ]; then
            echo "::warning::$((cases - passed)) of $cases integration tests did not pass. This job is non-blocking, so the merge is not gated; the failure is still real. Review the integration-test-results artifact."
          else
            echo "::warning::All $cases integration tests PASSED and the run still exited non-zero, so this is an infrastructure or teardown failure rather than a test failure (see issue #2195). Do not go looking for a broken test. Review the integration-test-results artifact."
          fi

      # Same reasoning as "Verify the UI suite actually ran" above, including why the floor is counted
      # here rather than passed to the runner: a failure is a warning, an empty or collapsed run is an
      # error. The floor sits between the 497 test METHODS in the project and the 623 cases they expand
      # to.
      - name: Verify the integration suite actually ran
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          report=TestResults/integration-results.trx
          if [ ! -s "$report" ]; then
            echo "::error::$report is missing or empty, so no integration test result was recorded at all. Written instead:"
            ls -la TestResults || true
            exit 1
          fi
          cases=$({ grep -o "<UnitTestResult " "$report" || true; } | wc -l)
          echo "TRX report: $(wc -c < "$report") bytes, $cases test results."
          if [ "$cases" -lt 550 ]; then
            echo "::error::the integration suite recorded only $cases results, under the floor of 550. Tests stopped being discovered rather than failing, so this job's result is meaningless."
            exit 1
          fi

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-results
          path: TestResults/**
          retention-days: 14

version: 2
updates:
  # Keep NuGet packages current: the app and its three test projects, read from the one solution. Every package's
  # version is in SysManager/Directory.Packages.props and each test project references the app, so an entry per project
  # proposed the app's own packages again under a test prefix and label, and a runtime upgrade arrived as
  # "deps(tests)" (#2744). Dependabot reads the projects a solution lists, so one entry proposes each package once.
  - package-ecosystem: "nuget"
    directory: "/SysManager"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group minor+patch bumps into one PR; keep majors separate for careful review.
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    # Group all action bumps into one PR — they're low-risk and SHA-pinned.
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  # Keep the pinned .NET SDK current. global.json pins an EXACT version with
  # "rollForward": "disable", so that a release built twice from the same tag cannot embed two
  # different runtimes (#2848) — which also means nothing else would ever raise it. This is what
  # turns the pin from a freeze into a reviewed bump.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

# No concurrency block at all meant a new push to a PR left the previous analysis of that same PR running
# alongside the new one, burning the runner minutes of a scan whose result was about to be superseded. See
# ci.yml's block for why main (the schedule trigger's ref too) groups by SHA instead of ref — the scheduled
# Monday run and a same-day push must not cancel each other, and distinct SHAs never share a group anyway
# (#2862).
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# See the same block in ci.yml. This workflow runs dotnet but no tests, so the SDK's opt-out is the one that
# applies (#2806).
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK global.json pins; release.yml's copy of this step explains why it is not
          # "whatever 10.0 is newest today" (#2848).
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: csharp
          queries: security-and-quality
          config-file: .github/codeql-config.yml

      - name: Build
        run: dotnet build SysManager/SysManager/SysManager.csproj -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: csharp

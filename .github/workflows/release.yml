name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.5.3). Run it on that tag: gh workflow run release.yml --ref v0.5.3 -f tag=v0.5.3"
        required: true

# Default for every job in this workflow: read-only. The guard job below only reads
# release metadata, so it needs nothing more. build-and-release re-declares the
# writes it actually needs, keeping the privileged token confined to that one job.
permissions:
  contents: read

# Serialize releases per tag so two pushes (or a tag push racing a manual dispatch)
# can't run two release jobs that race the winget publish and Discussions post.
# Never cancel an in-flight release — a half-published release is worse than a wait.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# See the same block in ci.yml: xUnit v3 test projects are Microsoft.Testing.Platform
# applications and that platform auto-registers a telemetry extension. The unit gate below
# runs them, so the opt-out belongs here too.
env:
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  guard:
    name: Skip if release already exists (tag move / re-push)
    # Pinned like every Linux job here; auto-release.yml says why.
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual dispatch is an explicit, intentional request — always allow it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — proceeding."
            exit 0
          fi
          tag="${{ github.ref_name }}"
          # A push event fires both for brand-new tags AND for moved/re-pushed tags.
          # A brand-new release has no GitHub Release yet; a moved tag already does.
          # Only release when none exists, so moving old tags can't re-trigger a
          # full release (which would hijack the "Latest" flag and flood Discussions).
          #
          # Only a 404 means "none exists". Any failure of `gh release view` used to read that way, so a
          # network error, a 5xx, a rate limit or a token problem on a moved tag rebuilt it and replaced
          # the published release's exe and hash with different ones (#2805). Any other answer fails here,
          # which skips the build and leaves the run red.
          if found=$(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq .id 2>&1); then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release for $tag already exists — skipping (tag move or re-push)."
          elif [[ "$found" == *"(HTTP 404)"* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "No release for $tag yet — proceeding."
          else
            echo "::error::Could not tell whether $tag already has a release, so nothing is built: $found"
            exit 1
          fi

  build-and-release:
    name: Build single-file exe & publish release
    needs: guard
    if: needs.guard.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    # Read by the winget job, which waits on the release being published rather than on this whole job:
    # a step after "Create GitHub Release" failing, such as the announcement, leaves a release that
    # should still reach winget.
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      published: ${{ steps.release.outcome == 'success' }}

    # Scoped to this job rather than the workflow: the guard job only reads release
    # metadata and must not be able to mint an OIDC token or write attestations.
    # id-token/attestations exist solely so the build can sign a provenance statement
    # binding this exe's digest to this repo, workflow and commit. Neither grants
    # any write access to repository content.
    permissions:
      contents: write
      discussions: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The attestation further down signs with this run's own commit and ref, GITHUB_SHA and
      # GITHUB_REF, not with the commit checked out above. A release dispatched from main builds the
      # tag but belongs to main's head, so once anything has landed on main since the tag, as it has
      # by the time a re-dispatch recovers a release, the permanent attestation would name a commit
      # that did not build the binary (#2805). Stopped here, before anything is built.
      - name: Check this run's commit is the one it builds
        shell: pwsh
        run: |
          $built = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $built) { throw "Could not read the checked-out commit." }
          if ($built -ne $env:GITHUB_SHA) {
              throw "This run belongs to $env:GITHUB_REF at $env:GITHUB_SHA, but it checked out $built, " +
                    "so its attestation would name a commit that did not build the binary. Dispatch " +
                    "the release on its tag: gh workflow run release.yml --ref <tag> -f tag=<tag>"
          }
          Write-Host "Building $built, this run's own commit."

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK global.json pins, not "whatever 10.0 is newest today". A self-contained publish
          # embeds the runtime the SDK carries, so a floating SDK meant two builds of the SAME TAG
          # could differ: a re-dispatch after a .NET servicing release replaced the published exe and
          # its .sha256 under the same URL, while the winget manifest already submitted kept the
          # first build's hash — and anyone who saved the first hash, as README's verification steps
          # invite, saw a mismatch. README calls the build reproducible, so it has to be (#2848).
          # setup-dotnet DOWNLOADS the pinned version, so this does not depend on the runner image
          # happening to carry it.
          global-json-file: global.json

      - name: Extract tag version
        id: version
        shell: pwsh
        env:
          # Pass the tag through the environment instead of interpolating ${{ }} directly
          # into the script body — that avoids any script-injection from a crafted manual
          # dispatch input and keeps the value as plain data.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:INPUT_TAG } else { $env:REF_NAME }
          # Validate the tag shape (vMAJOR.MINOR.PATCH) before using it anywhere.
          # End-anchored ($) so a crafted tag can't append trailing content that
          # slips past the guard on this privileged (contents/discussions: write) workflow.
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Invalid release tag '$tag' — expected a semver tag like v1.2.3."
            exit 1
          }
          $version = $tag -replace '^v', ''
          "tag=$tag"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $version from tag $tag"

      - name: Restore
        run: dotnet restore SysManager/SysManager/SysManager.csproj

      # Microsoft.Testing.Platform arguments; see the same step in ci.yml for why. The floor is here too
      # rather than only there, because a release can be dispatched manually without passing through a PR
      # — a gate that lets a run of nothing through is not a gate. 8700, the same number as ci.yml's
      # copy, so the two floors cannot drift apart on what the real count is (#2862).
      #
      # --hangdump: same reason as ci.yml's unit job (#2847) — without it, a hung test here ends this
      # job at its 30-minute timeout-minutes and names nothing, on the gate a manually-dispatched
      # release passes through with no PR involved at all.
      - name: Run unit tests (must pass)
        id: unit-tests
        run: >
          dotnet test --project SysManager/SysManager.Tests/SysManager.Tests.csproj
          -c Release
          --results-directory TestResults
          --minimum-expected-tests 8700
          --hangdump --hangdump-timeout 5m
          --report-xunit-trx --report-xunit-trx-filename unit-results.trx

      # Same step as ci.yml's unit job, for the same reason: this job's timeout-minutes cancels it on a
      # hang, which satisfies neither a normal failure check nor the implicit success() default, so
      # nothing named the hung test here either (#2847).
      - name: Name the hung unit test if the run was killed
        if: ${{ cancelled() }}
        shell: bash
        run: |
          echo "The unit run did not finish and the job was cancelled — almost certainly this job's"
          echo "timeout-minutes. The hang dump names the test that was still running:"
          found=0
          for log in TestResults/*hang.log; do
            [ -s "$log" ] || continue
            found=1
            echo "::warning::hang in $(basename "$log"): $(tr -d '\r' < "$log" | tr '\n' ' ')"
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning::No *hang.log was written, so --hangdump did not fire and the cancellation came from something other than a stuck test. Written instead:"
            ls -la TestResults || true
          fi

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          ./publish.ps1 -Configuration Release -Runtime win-x64 -Output publish -Version $ver

      - name: Rename exe with version
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $src = "publish/SysManager.exe"
          $newName = "SysManager-v${ver}.exe"
          if (-not (Test-Path $src)) { throw "Missing $src" }
          Rename-Item $src -NewName $newName
          Write-Host "Renamed to publish/$newName"

      - name: Verify the embedded version stamp
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # publish.ps1 injects Version, FileVersion and AssemblyVersion from the tag, and until now
          # nothing ever looked at what actually landed in the binary — ci.yml only checks that the
          # three csproj values agree with EACH OTHER, which says nothing about the artifact. A
          # broken injection would ship a binary that misreports itself in About, in the bug-report
          # URL, in the profile export, in the system report, and worst of all in the update check:
          # AboutViewModel compares UpdateService.CurrentVersion against the newest release, so a
          # stale stamp offers every user the same update forever, or hides a real one.
          #
          # Placed before the SBOM and the attestation on purpose. Attesting is a public, signed
          # claim about a specific binary; making that claim about a mis-stamped one and retracting
          # it afterwards is far worse than never making it.
          $exe = Resolve-Path "publish/SysManager-v$env:VERSION.exe"
          $info = (Get-Item $exe).VersionInfo

          # publish.ps1 appends a fourth component to FileVersion (-p:FileVersion=$Version.0).
          if ($info.FileVersion -ne "$env:VERSION.0") {
              throw "FileVersion drift: the binary reports '$($info.FileVersion)' but the tag " +
                    "requires '$env:VERSION.0'. The version injection in publish.ps1 did not take, " +
                    "so this artifact would misreport itself to every user. Not publishing it."
          }

          # ProductVersion is the informational version. ContinuousIntegrationBuild + SourceLink
          # suffix it with '+<commit sha>', so compare only the part before the '+' — and keep the
          # whole value in the log, because it is where the artifact records the commit it came from.
          $product = ($info.ProductVersion -split '\+')[0]
          if ($product -ne $env:VERSION) {
              throw "ProductVersion drift: the binary reports '$($info.ProductVersion)' but the " +
                    "tag requires '$env:VERSION'. Not publishing it."
          }

          Write-Host "Version resource matches the tag: FileVersion $($info.FileVersion), ProductVersion $($info.ProductVersion)."

      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $exe = "publish/SysManager-v${ver}.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $hashFile = "publish/SysManager-v${ver}.exe.sha256"
          "$hash *SysManager-v${ver}.exe" | Out-File -FilePath $hashFile -Encoding ascii -NoNewline
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "SHA256: $hash"

      # BEFORE the SBOM and the attestation, deliberately. This step can still reject the build
      # ("Runtime version drift", a startup fault, a crash marker), and it used to run after
      # "Attest build provenance" — so a binary this gate refused already had a provenance statement
      # in the public Sigstore transparency log and in the repository's attestation store, for an exe
      # that never shipped. Same reasoning the version-stamp check above already gives for its own
      # position: making that claim about a build and retracting it afterwards is far worse than
      # never making it (#2848).
      - name: Smoke-check the published exe
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = Resolve-Path "publish/SysManager-v$env:VERSION.exe"
          $marker = Join-Path $env:LOCALAPPDATA 'SysManager\last-crash.json'
          $logs = Join-Path $env:LOCALAPPDATA 'SysManager\logs'

          # A marker from an earlier run on this image would be read as this run's crash.
          # The runner is ephemeral, so this is belt-and-braces, but a false PASS and a false
          # FAIL are both worse than one Remove-Item.
          Remove-Item $marker -ErrorAction SilentlyContinue

          Write-Host "Launching $exe"
          $app = Start-Process -FilePath $exe -PassThru

          # Long enough for the shell to build, the eager view models to construct and the
          # first frame to render. A crash on this path is immediate, not gradual.
          Start-Sleep -Seconds 25

          $alive = -not $app.HasExited
          $exitCode = if ($app.HasExited) { $app.ExitCode } else { $null }

          if ($alive) {
              # Killed outright, NOT closed via CloseMainWindow(). The first version asked politely,
              # on the theory that the normal shutdown path would surface a teardown fault. On a CI
              # runner that theory is wrong, and provably so: a runner is always a FIRST launch, so
              # close-preference.json does not exist, ClosePreferenceService.Load() returns Ask, and
              # MainWindow.OnClosing shows a modal MessageBox asking whether to keep running in the
              # notification area. Nobody answers it, so WM_CLOSE never completes and the step warned
              # "the window did not close within 15s" on the very first release that ran it (v1.65.6).
              #
              # That prompt is correct behaviour — it is the fix for #1639/#1827 — so the check was
              # wrong, not the app. A warning that fires on every single release is worse than no
              # warning: it trains everyone to ignore the one that eventually matters.
              #
              # This step has exactly one job: prove the published binary starts and survives. A clean
              # shutdown is a different property, it needs a real desktop and a pre-seeded preference,
              # and it belongs to the FlaUI suite rather than to the release gate.
              Write-Host "Process $($app.Id) is alive after 25s; stopping it."
              $app.Kill()
              if (-not $app.WaitForExit(10000)) {
                  throw "The process did not exit within 10 seconds of being killed, which means the " +
                        "runner cannot reclaim it. Investigate before trusting this release."
              }
          }

          # The log is written even when the app dies before showing a window, so it is the
          # only diagnostic available for the failing case. Emitted before the throw.
          if (Test-Path $logs) {
              $log = Get-ChildItem $logs -Filter '*.log' |
                     Sort-Object LastWriteTime -Descending |
                     Select-Object -First 1
              if ($log) {
                  Write-Host "--- tail of $($log.Name) ---"
                  Get-Content $log.FullName -Tail 40 | ForEach-Object { Write-Host $_ }
                  Write-Host "--- end of log ---"
              }
          }

          if (-not $alive) {
              # App.OnDomain writes the marker as the process dies, so this is where it can exist.
              if (Test-Path $marker) {
                  Write-Host "--- last-crash.json ---"
                  Get-Content $marker -Raw | Write-Host
              }
              throw "The published exe exited on its own within 25 seconds (exit code " +
                    "$exitCode). It builds and passes the unit tests but does not run, so this " +
                    "release must not be published. The log tail above is from the failed launch."
          }

          # The version the RUNNING app reports, which is a different property from the version
          # resource checked before the SBOM. About, the update check, the bug-report URL, the
          # profile export and the system report all read UpdateService.CurrentVersion — the managed
          # assembly version, which is absent from the Win32 resource and cannot be read out of a
          # single-file bundle (AssemblyName.GetAssemblyName throws on the apphost). This launch is
          # the only place it is observable, so it is asserted here rather than by starting the app a
          # second time just to ask.
          if (-not $log) {
              throw "No log file was produced, so the version the running app reports could not be " +
                    "verified. LogService.Init writes the startup line before any window appears, " +
                    "so its absence is itself a failure."
          }

          # An unhandled exception on a background thread kills the process, but one on the UI
          # thread is handled while the window stays up, so "still alive" alone is not proof of a
          # clean start. App.OnUi logs that one at Error, and a tab whose start faults logs Error or
          # Fatal. This step looked for the crash marker instead, which only App.OnDomain writes, as
          # the process dies, so a process still alive here never had one (#2805).
          $faults = @(Get-Content $log.FullName | Where-Object { $_ -match '\[(ERR|FTL)\]' })
          if ($faults.Count -gt 0) {
              Write-Host "--- error and fatal lines from the startup log ---"
              $faults | ForEach-Object { Write-Host $_ }
              throw "The published exe logged $($faults.Count) error or fatal line(s) while it started. " +
                    "It survived the 25-second window but faulted, so this release must not be published."
          }

          $expected = "SysManager $env:VERSION started"
          $startup = Get-Content $log.FullName |
                     Where-Object { $_ -match '\[INF\] SysManager .* started' } |
                     Select-Object -First 1
          if (-not $startup) {
              throw "The log has no 'SysManager <version> started' line, so nothing here verified " +
                    "the version. Either LogService.StartupMessage changed shape — update this gate " +
                    "in the same PR, do not delete it — or the app never got as far as logging it."
          }
          if ($startup -notlike "*$expected*") {
              throw "Runtime version drift: the app logged '$($startup.Trim())' but the tag requires " +
                    "'$expected'. The assembly version injection did not take, so About and the " +
                    "update check would misreport this build. Not publishing it."
          }
          Write-Host "The running app reports version $env:VERSION."

          Write-Host "The published exe started, stayed alive for 25s and logged no error."

          # ── Again, WITHOUT elevation ────────────────────────────────────────────────────
          # The run above is elevated: Start-Process inherits the runner's token, and the GitHub
          # Windows runner is an administrator. Start-up takes different code without it —
          # TemperatureService reads NVIDIA, WMI disk temperatures and a CPU placeholder instead of
          # LibreHardwareMonitor, and PowerShellRunner and MainWindowViewModel branch on elevation
          # too — so a fault confined to an ordinary double-click start, which is what the people
          # this app is for actually do, passed this gate every time. The log tail above says
          # "Elevated: true", which is how it was spotted (#2848).
          #
          # runas /trustlevel:0x20000 launches with a filtered token. It needs no password, but it is
          # an environment capability this gate cannot verify in advance, so the two outcomes are
          # separated on purpose:
          #   * it starts un-elevated and then crashes, logs ERR/FTL, or leaves a crash marker
          #     -> FATAL, which is the whole point of adding this;
          #   * it cannot be started un-elevated at all, or the log does not confirm the token was
          #     filtered -> a visible WARNING and nothing more, because blocking every release on a
          #     runner limitation would be worse than the gap this closes.
          # The "Elevated: false" assertion is what stops this from being vacuous: without it, a
          # filtered launch that silently ran elevated anyway would re-check the path already
          # covered and report success.
          Remove-Item $marker -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $logs '*.log') -ErrorAction SilentlyContinue

          $exeName = [System.IO.Path]::GetFileNameWithoutExtension($exe)
          $launched = $null
          $runasReturned = $false
          try {
              # BOUNDED, and with stdin already at end-of-input. Two faults were found here the hard
              # way, both worth keeping written down:
              #
              #   * the first version used `-Wait` inside a try/catch and took the job to its
              #     30-minute ceiling on v1.131.3, with no step output at all: runas blocks waiting
              #     for input an Actions step cannot give it, and a try/catch cannot catch a HANG.
              #     Only a timeout can, which is what WaitForExit(ms) is here for.
              #   * 'NUL' is not a path Start-Process accepts for -RedirectStandardInput: the launch
              #     fails and -PassThru hands back $null, so every release would have warned and
              #     skipped this check forever. An empty real file is what works.
              #
              # runas's exit code is deliberately NOT consulted: Start-Process -PassThru leaves
              # ExitCode null here even after the process has exited (measured), so a check on it
              # would always read "failed" and make this gate permanently vacuous. What the gate
              # trusts instead is the OBSERVABLE outcome below — a running process and a log that
              # says "Elevated: false". If runas did not do its job, neither of those appears.
              $emptyStdin = Join-Path $env:RUNNER_TEMP 'empty-stdin.txt'
              New-Item -ItemType File -Path $emptyStdin -Force | Out-Null

              $runas = Start-Process -FilePath 'runas.exe' `
                                     -ArgumentList '/trustlevel:0x20000', "`"$exe`"" `
                                     -PassThru -WindowStyle Hidden `
                                     -RedirectStandardInput $emptyStdin
              if ($null -eq $runas) {
                  Write-Host "::warning::runas could not be started at all. The un-elevated start was NOT verified for this release."
              }
              elseif (-not $runas.WaitForExit(20000)) {
                  $runas.Kill()
                  $runas.WaitForExit(5000) | Out-Null
                  Write-Host "::warning::runas did not return within 20s, so it was stopped. The un-elevated start was NOT verified for this release."
              }
              else {
                  $runasReturned = $true
                  Start-Sleep -Seconds 25
                  $launched = Get-Process -Name $exeName -ErrorAction SilentlyContinue |
                              Select-Object -First 1
              }
          }
          catch {
              Write-Host "::warning::Could not start the exe with a filtered token: $($_.Exception.Message). The un-elevated start was NOT verified for this release."
          }

          $unelevatedLog = if ($runasReturned -and (Test-Path $logs)) {
              Get-ChildItem $logs -Filter '*.log' |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          } else { $null }

          if (-not $unelevatedLog) {
              if ($runasReturned) {
                  Write-Host "::warning::The un-elevated start produced no log, so it could not be checked. Nothing here says the release is bad; it says this gate did not run."
              }
          }
          else {
              $tail = Get-Content $unelevatedLog.FullName
              Write-Host "--- tail of the un-elevated $($unelevatedLog.Name) ---"
              $tail | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
              Write-Host "--- end of log ---"

              # Did the token filtering actually take? If not, this proved nothing.
              $sawUnelevated = @($tail | Where-Object { $_ -match 'Elevated:\s*false' }).Count -gt 0
              if (-not $sawUnelevated) {
                  Write-Host "::warning::The log does not report 'Elevated: false', so the filtered token did not take effect and the un-elevated path was NOT verified."
              }
              else {
                  # From here the findings are real, so they are fatal.
                  $unelevatedFaults = @($tail | Where-Object { $_ -match '\[(ERR|FTL)\]' })
                  if ($unelevatedFaults.Count -gt 0) {
                      Write-Host "--- error and fatal lines from the un-elevated start ---"
                      $unelevatedFaults | ForEach-Object { Write-Host $_ }
                      throw "Started WITHOUT elevation, the published exe logged " +
                            "$($unelevatedFaults.Count) error or fatal line(s). That is the way the " +
                            "people this app is for start it, so this release must not be published."
                  }
                  if (Test-Path $marker) {
                      Write-Host "--- last-crash.json from the un-elevated start ---"
                      Get-Content $marker -Raw | Write-Host
                      throw "Started WITHOUT elevation, the published exe recorded a crash. It " +
                            "survives an elevated start, which is why this was invisible before."
                  }
                  if (-not $launched) {
                      throw "Started WITHOUT elevation, the published exe was gone within 25 " +
                            "seconds and left no crash marker. It starts when elevated, so this " +
                            "release must not be published."
                  }
                  Write-Host "The published exe also started un-elevated, stayed alive and logged no error."
              }
          }

          if ($launched) {
              $launched.Kill()
              $launched.WaitForExit(10000) | Out-Null
          }

      # The shipped exe is self-contained and single-file, so its contents are opaque:
      # neither the binary nor its .sha256 says which dependencies are embedded. The SBOM
      # is the machine-readable answer. Generated AFTER publish and with the same
      # framework/runtime, so it reads the graph that was actually published rather than
      # a RID-agnostic restore.
      #
      # Note this is a restore-graph inventory, not a byte-level manifest of the exe:
      # verified against a real win-x64 publish, 71 components resolve, of which 14 are
      # RID-specific placeholder packages (Linux/macOS/Android variants of
      # System.IO.Ports and SkiaSharp/HarfBuzz native assets, all empty '_._' on this
      # RID) plus System.IO.Hashing, a build-time transitive of SourceLink that never
      # reaches the output. They are kept rather than filtered because a
      # vulnerability-feed consumer wants the resolved set, and hand-maintaining an
      # exclusion list would silently rot as the graph changes.
      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          # Version-pinned like every action in this workflow — an unpinned tool is an
          # unreviewed dependency in the release path.
          dotnet tool install --global CycloneDX --version 6.2.0
          if ($LASTEXITCODE -ne 0) { throw "Failed to install the CycloneDX tool." }
          dotnet-CycloneDX SysManager/SysManager/SysManager.csproj `
            --output publish `
            --filename "SysManager-v${ver}.sbom.json" `
            --output-format Json `
            --framework net10.0-windows `
            --runtime win-x64 `
            --exclude-dev `
            --set-name SysManager `
            --set-version $ver
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed." }
          $sbom = "publish/SysManager-v${ver}.sbom.json"
          if (-not (Test-Path $sbom)) { throw "Missing $sbom" }
          $components = (Get-Content $sbom -Raw | ConvertFrom-Json).components.Count
          if (-not $components) { throw "SBOM contains no components — refusing to publish an empty inventory." }
          Write-Host "SBOM written with $components components."

      # Binds this exact binary digest to this repository, workflow and commit in the
      # public Sigstore transparency log. The .sha256 file cannot do this: it ships from
      # the same release as the exe, so both share one trust root. Anyone can verify with
      #   gh attestation verify SysManager-v<version>.exe --repo laurentiu021/SystemManager
      # Deliberately placed BEFORE the release is created, so a failure here aborts the
      # run instead of leaving a published release without provenance.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: publish/SysManager-v${{ steps.version.outputs.version }}.exe

      # Nothing above this point has ever RUN the artifact being published. The unit tests
      # exercise the code, but they load assemblies into a test host — they do not start the
      # single-file, self-contained, compressed exe that users actually download. Those are
      # different failure surfaces: a missing native library extracted from the bundle, a
      # startup path that throws before the first frame, or a resource that resolves in a
      # normal build but not from a packed one, all pass every test and then fail on launch.
      # That shipped once already, which is why the standing rule is that a release is not
      # trusted until the published binary has been seen alive.
      #
      # windows-latest provides a desktop session (the ui-tests job in ci.yml relies on the
      # same thing), so the exe can be started here — the one place in the pipeline where the
      # real artifact exists and nothing has been published yet. A failure aborts the run
      # before the release, the winget submission and the announcement, instead of after.
      #
      # Deliberately a smoke check, not a UI test: start it, hold it, confirm the process is
      # still alive and that it left no crash marker, then close it. No assertions about what
      # is on screen — ci.yml's FlaUI job owns that, and duplicating it here would make the
      # release depend on UI timing.
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $changelog = Get-Content CHANGELOG.md -Raw
          # Grab the block for this version (between its header and the next "## [" header or EOF).
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          $notesPath = "release-notes.md"
          if (-not $match.Success) {
              # Fail loud: a release with no CHANGELOG entry would otherwise ship a
              # generic "see CHANGELOG" placeholder. Stop here so the missing entry
              # is added before the release is published.
              throw "No CHANGELOG.md entry found for version $version. Add a '## [$version] - <date>' section before releasing."
          }
          $body = $match.Value.Trim()
          if ($body -match "(?m)^## \[$([regex]::Escape($version))\].*$\s*\z") {
              # Header exists but the section is empty (no notes beneath it).
              throw "CHANGELOG.md entry for version $version is empty. Add release notes under the '## [$version]' header before releasing."
          }

          # Third guard: the entry must open with plain-English prose, before its first "###" category.
          #
          # The release page and the auto-posted discussion are where someone decides whether to
          # download this, and because the block above is copied VERBATIM, whatever the entry starts
          # with is the first thing they read. For five of the biggest feature releases (1.53.0,
          # 1.54.0, 1.55.0, 1.55.1, 1.56.0) that was a bare semver heading followed by engineering
          # prose, because the friendly lead was pasted in by hand afterwards and those five were
          # missed. A convention that depends on remembering is one that lapses.
          #
          # Enforcing it HERE, rather than adding a step that writes a summary, keeps CHANGELOG.md the
          # single source of truth: the lead then reaches the release body and the discussion for free.
          $afterHeader = ($body -split "(?m)^## \[.*$", 2)[1]
          $beforeFirstCategory = ($afterHeader -split "(?m)^### ", 2)[0]
          # Keep only lines that are real prose: blank lines and stray markdown rules do not count.
          # @() keeps this an array even for a one-line lead, which PowerShell would otherwise unwrap.
          $leadLines = @($beforeFirstCategory -split "`r?`n" |
              Where-Object { $_.Trim() -ne "" -and $_.Trim() -notmatch "^(-{3,}|\*{3,}|_{3,})$" })
          if ($leadLines.Count -eq 0) {
              # Joined rather than a here-string: PowerShell wants a here-string's body and closing "@
              # at column 0, which would terminate the YAML block scalar this script lives in.
              $msg = @(
                  "CHANGELOG.md entry for version $version has no plain-English lead."
                  ""
                  "Add one or two sentences directly under the '## [$version]' header, BEFORE the first"
                  "'###' category, describing what changed in the words a user would use. That paragraph"
                  "becomes the first thing readers see on the release page and in the announcement"
                  "discussion, because this step copies the entry verbatim."
                  ""
                  "Example:"
                  ""
                  "  ## [$version] - <date>"
                  ""
                  "  Quick Tune-Up now shows you what it found, instead of throwing the results away."
                  ""
                  "  ### Fixed"
                  "  - ..."
              ) -join [Environment]::NewLine
              throw $msg
          }

          # Normalize the entry's DATE to the day this release actually publishes (#1806).
          #
          # The header date is written by hand while a pull request is being prepared, but the release it
          # describes publishes when that PR merges. A merge that crosses midnight UTC therefore ships
          # yesterday's date — and because $body is copied VERBATIM into the release body and the
          # announcement discussion, the wrong date reaches three public surfaces at once. It happened
          # twice consecutively: 1.61.9 and 1.61.10 both read 2026-08-11 and published on the 12th.
          #
          # Keep a Changelog defines this field as the RELEASE date, so the workflow — the only
          # participant that knows that date — owns it instead of asking a human to predict it.
          #
          # Scope: this corrects the three PUBLISHED surfaces (release body, announcement discussion, and
          # the notes artifact), which is where a wrong date is actually read. CHANGELOG.md in the repo
          # keeps whatever date the author typed; correcting the file too would mean this workflow pushing
          # a commit to main, which is a bigger decision than a date fix and is deliberately left out.
          # The consequence is bounded and visible: the file may read one day earlier than the release it
          # describes, while every public surface reads correctly.
          $today = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $headerPattern = "^## \[$([regex]::Escape($version))\].*$"
          $body = [regex]::Replace($body, $headerPattern, "## [$version] - $today", 'Multiline')
          "date=$today" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $body | Out-File -FilePath $notesPath -Encoding utf8
          "path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Append verification instructions to release notes
        shell: pwsh
        env:
          # Passed as data rather than interpolated into the script body, matching the
          # tag-extraction step above.
          VERSION: ${{ steps.version.outputs.version }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          # A literal here-string keeps the markdown code fences readable — an expandable
          # one would need every backtick escaped, which is what made this unreadable
          # before. The two placeholders are substituted after the fact.
          $template = @'

          ---

          ### Verify the download

          ```powershell
          Get-FileHash .\SysManager-__TAG__.exe -Algorithm SHA256
          ```

          Expected SHA256: `__HASH__`

          This build is not code-signed, so Windows will warn on first launch. That is
          expected for a small independent app: [see what the warning says and what to
          click](https://github.com/laurentiu021/SystemManager#first-launch-windows-will-warn-you).
          Code signing is planned through the [SignPath Foundation](https://signpath.org/),
          which provides free certificates to open-source projects, with signing performed by
          [SignPath.io](https://signpath.io/). Until then, the SHA256 above and the build
          attestation below are what establish that a download is the genuine build.

          ### Code signing policy

          This release is **not** code-signed. The team roles, release-approval process and
          privacy policy required by the [SignPath Foundation](https://signpath.org/) programme
          are documented in advance under [Code signing
          policy](https://github.com/laurentiu021/SystemManager#code-signing-policy). That
          documentation is a prerequisite for applying, not evidence of a certificate. The
          attribution line naming SignPath as the signing provider will appear here once a
          certificate is actually issued.

          This program will not transfer any information to other networked systems unless
          specifically requested by the user or the person installing or operating it. Two checks
          run on their own when SysManager starts: the version check against the GitHub Releases
          API, at most once a day, and the Dashboard's app-updates alert, which asks winget. The
          About tab can switch off either. Everything else that uses the network runs only when you
          use it. Full
          [privacy policy](https://github.com/laurentiu021/SystemManager/blob/main/SECURITY.md#privacy).

          ### Verify where this binary came from

          This exe was built by GitHub Actions from this public source, and the build is
          recorded in the Sigstore public transparency log. With the
          [GitHub CLI](https://cli.github.com/):

          ```powershell
          gh attestation verify .\SysManager-__TAG__.exe --repo laurentiu021/SystemManager
          ```

          That proves which commit and workflow produced this exact binary, something the
          SHA256 file cannot show, since it is published alongside the exe it describes.
          Each release also ships `SysManager-__TAG__.sbom.json`, a CycloneDX inventory of
          every dependency resolved for this build.
          '@
          $notes = $template.Replace('__TAG__', "v$env:VERSION").Replace('__HASH__', $env:HASH)
          # This appended block is deliberately ASCII-only. A non-ASCII character here is
          # decoded according to how the host reads this script file, so the same text can
          # render as mojibake under a different PowerShell host than the one used in CI.
          # The CHANGELOG body above is untouched and keeps its punctuation; only this
          # generated footer is constrained. Fail the release rather than publish garbled
          # notes to both the release page and the Discussions announcement.
          $nonAscii = [regex]::Matches($notes, '[^\x00-\x7F]')
          if ($nonAscii.Count -gt 0) {
              throw "The appended verification notes must be ASCII-only; found $($nonAscii.Count) non-ASCII character(s): $(($nonAscii | ForEach-Object { $_.Value }) -join ' ')"
          }
          Add-Content release-notes.md $notes -Encoding utf8

      # The guard against replacing a binary people already have. This workflow is re-dispatchable
      # and rebuilds from scratch, and the publish step below is not additive — it overwrites an
      # asset of the same name, under the same URL. So a re-run whose bytes differ would hand a
      # DIFFERENT exe to everyone from then on, while the winget manifest already submitted keeps
      # the first build's InstallerSha256 and anyone who saved the first hash (README's verification
      # steps invite exactly that) sees a mismatch they cannot explain.
      #
      # Pinning the SDK above removes the cause that was actually observed; this refuses the symptom
      # whatever the cause, which is the half that keeps being true after the next unrelated change.
      # On the normal path — a tag that has no release yet — there is nothing to compare and the step
      # says so and moves on.
      - name: If this release already exists, the bytes must match what it published
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REBUILT: ${{ steps.hash.outputs.hash }}
        run: |
          $asset = "SysManager-v$env:VERSION.exe.sha256"
          $published = $null
          try {
              gh release download $env:TAG --pattern $asset --dir published 2>$null
              $file = Join-Path 'published' $asset
              if (Test-Path $file) {
                  # The file is "<hash> *<name>"; take the hash and compare case-insensitively.
                  $published = ((Get-Content $file -Raw) -split '\s+')[0].Trim()
              }
          }
          catch {
              # No release yet, or no such asset on it: the normal path for a new tag.
          }

          if (-not $published) {
              Write-Host "No published .sha256 for $env:TAG — this release is new, nothing to compare."
              exit 0
          }

          Write-Host "published $published"
          Write-Host "rebuilt   $env:REBUILT"
          if ($published -ne $env:REBUILT) {
              throw "This tag already published an exe with SHA256 $published, and this run built " +
                    "$($env:REBUILT). Publishing would silently replace a binary people may already " +
                    "have, and leave the winget manifest pointing at the old hash. Find out why the " +
                    "bytes changed — the SDK pin in global.json exists to stop exactly this — rather " +
                    "than overwriting it."
          }
          Write-Host "The rebuilt exe is byte-identical to the one already published."

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SysManager ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          # The step above is what makes re-publishing safe: it has already refused a rebuild whose
          # bytes differ from what this tag published, so reaching here means the assets are the
          # same ones. Left additive on purpose rather than set to fail on an existing file, because
          # a re-dispatch must still be able to repair a release whose upload was interrupted.
          files: |
            publish/SysManager-v${{ steps.version.outputs.version }}.exe
            publish/SysManager-v${{ steps.version.outputs.version }}.exe.sha256
            publish/SysManager-v${{ steps.version.outputs.version }}.sbom.json

      # One announcement per release turned Discussions into a wall: every one of the 645 discussions
      # was a release bot post, and the five human categories were empty, so the only low-friction
      # channel for someone who will not open an issue had no human first screen at all.
      #
      # Gated on the patch component rather than on a bump type, because release.yml is also runnable
      # from a tag and does not otherwise know how the version was decided. Patch 0 is exactly the set
      # semantic-release produces for feat: and feat!: — 1.76.0, 2.0.0 — while every fix: lands as
      # 1.75.30 and above. Deliberately NOT `endsWith(version, '.0')`, which is the same test written
      # so that 1.75.10 makes a reader stop and check.
      - name: Decide whether this release gets an announcement
        id: announce
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          patch="${VERSION##*.}"
          if [ "$patch" = "0" ]; then
            echo "post=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is a feature release — posting an announcement."
          else
            echo "post=false" >> "$GITHUB_OUTPUT"
            echo "$VERSION is a patch release — no announcement, so human threads stay readable."
          fi

      - name: Post announcement to Discussions
        if: steps.announce.outputs.post == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const version = '${{ steps.version.outputs.version }}';
            const tag = '${{ steps.version.outputs.tag }}';
            const notes = fs.readFileSync('release-notes.md', 'utf8');
            const releaseUrl = '${{ steps.release.outputs.url }}';

            // Find the Announcements discussion category
            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  discussionCategories(first: 20) {
                    nodes { id name }
                  }
                }
              }`;
            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const categories = result.repository.discussionCategories.nodes;
            const cat = categories.find(c => c.name === 'Announcements');
            if (!cat) { console.log('Announcements category not found, skipping.'); return; }

            const title = `SysManager ${version} released`;

            // Skip if this version was already announced. A manual re-dispatch is the
            // normal recovery when a release fails partway (the guard job deliberately
            // allows it), and without this check every retry posts another copy of the
            // same announcement. Checking the category rather than searching keeps this
            // exact — titles are generated here, so an existing match is definitive.
            const existingQuery = `
              query($owner: String!, $repo: String!, $catId: ID!) {
                repository(owner: $owner, name: $repo) {
                  discussions(first: 25, categoryId: $catId, orderBy: {field: CREATED_AT, direction: DESC}) {
                    nodes { title url }
                  }
                }
              }`;
            const existing = await github.graphql(existingQuery, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              catId: cat.id,
            });
            const already = existing.repository.discussions.nodes.find(d => d.title === title);
            if (already) {
              console.log(`Already announced: ${already.url} — skipping.`);
              return;
            }

            const repoQuery = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) { id }
              }`;
            const repoResult = await github.graphql(repoQuery, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const mutation = `
              mutation($repoId: ID!, $catId: ID!, $title: String!, $body: String!) {
                createDiscussion(input: {
                  repositoryId: $repoId,
                  categoryId: $catId,
                  title: $title,
                  body: $body
                }) { discussion { url } }
              }`;
            const body = `## SysManager ${version} is out!\n\n[Download from GitHub Releases](${releaseUrl})\n\n${notes}`;
            await github.graphql(mutation, {
              repoId: repoResult.repository.id,
              catId: cat.id,
              title,
              body,
            });
            console.log(`Discussion posted for ${version}`);

  # The winget submission, in winget.yml so that it also runs by itself to retry one that failed
  # (#2805). It gets the winget token and nothing else, and runs only for a release this run published.
  winget:
    name: Submit to winget
    needs: build-and-release
    if: ${{ !cancelled() && needs.build-and-release.outputs.published == 'true' }}
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ needs.build-and-release.outputs.tag }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  # Starts the release integrity check once this run is done with the release, whichever way it went. A
  # workflow_run trigger on this workflow never fired: auto-release dispatches it with GITHUB_TOKEN, and GitHub
  # starts no run from an event that token caused, apart from a dispatch (#2805). The check is given this run's
  # id, because this run is still going as it starts and the check waits out every other release in flight.
  integrity:
    name: Start the release integrity check
    needs: [guard, build-and-release, winget]
    if: ${{ always() && needs.guard.outputs.should_release == 'true' }}
    # Pinned like every Linux job here; auto-release.yml says why.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start release-integrity.yml
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
        run: gh workflow run release-integrity.yml --repo "${GITHUB_REPOSITORY}" --ref main -f after_run="${RUN}"

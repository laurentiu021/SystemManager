name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: windows-latest
    # 25, not 10. This job normally takes 5-8 minutes — the tests themselves are ~1 of those, the
    # rest is checkout, SDK setup, restore and four sequential builds — so a 10-minute ceiling left
    # only ~2 minutes of headroom. A slow runner then blew it, and a job killed by its timeout has
    # conclusion `cancelled`, which `gh pr checks` renders as `fail`: indistinguishable from a real
    # test failure, while the log still says "Passed! Failed: 0". That happened three times on
    # 2026-08-06 and left a PR blocked for days over nothing. A ceiling is here to catch a HUNG job,
    # and 25 minutes still does that. (ui-tests below already allows 30 for a ~4-minute job.)
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are needed by "Check the version is the one the merge will tag" below, which
          # compares the PR's version against a bump from the newest tag. A shallow clone carries no
          # tags, so that check would silently pass against nothing.
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore SysManager/SysManager/SysManager.csproj
          dotnet restore SysManager/SysManager.Tests/SysManager.Tests.csproj
          dotnet restore SysManager/SysManager.IntegrationTests/SysManager.IntegrationTests.csproj
          dotnet restore SysManager/SysManager.UITests/SysManager.UITests.csproj

      # Format-check every C# project the workflow builds, not just the main one —
      # the same .editorconfig governs the test projects, so otherwise their style
      # could drift past CI silently.
      - name: Check formatting
        run: |
          dotnet format SysManager/SysManager/SysManager.csproj --verify-no-changes --verbosity diagnostic
          dotnet format SysManager/SysManager.Tests/SysManager.Tests.csproj --verify-no-changes --verbosity diagnostic
          dotnet format SysManager/SysManager.IntegrationTests/SysManager.IntegrationTests.csproj --verify-no-changes --verbosity diagnostic
          dotnet format SysManager/SysManager.UITests/SysManager.UITests.csproj --verify-no-changes --verbosity diagnostic

      # The release workflow derives its notes from the CHANGELOG section matching the TAG that
      # auto-release computed from the commit type (feat: -> minor, fix: -> patch). If the csproj
      # version and the newest CHANGELOG header disagree with that bump, the release fails after the
      # tag is already pushed — leaving a tag with no release. Catch the mismatch here, on the PR,
      # where it costs one edit instead of a stuck release.
      - name: Check version consistency
        shell: pwsh
        run: |
          $csproj = Select-Xml -Path SysManager/SysManager/SysManager.csproj -XPath '//Version' |
                    Select-Object -First 1 -ExpandProperty Node | Select-Object -ExpandProperty '#text'
          $file = Select-Xml -Path SysManager/SysManager/SysManager.csproj -XPath '//FileVersion' |
                  Select-Object -First 1 -ExpandProperty Node | Select-Object -ExpandProperty '#text'
          $asm = Select-Xml -Path SysManager/SysManager/SysManager.csproj -XPath '//AssemblyVersion' |
                 Select-Object -First 1 -ExpandProperty Node | Select-Object -ExpandProperty '#text'

          # The three csproj versions must agree (FileVersion/AssemblyVersion carry a 4th component).
          if ($file -ne "$csproj.0") { throw "FileVersion ($file) does not match Version ($csproj)." }
          if ($asm -ne "$csproj.0") { throw "AssemblyVersion ($asm) does not match Version ($csproj)." }

          # The newest CHANGELOG entry must be for that same version, or the release step that reads
          # release notes out of the CHANGELOG finds nothing.
          $head = (Select-String -Path CHANGELOG.md -Pattern '^## \[([0-9]+\.[0-9]+\.[0-9]+)\]' |
                   Select-Object -First 1).Matches[0].Groups[1].Value
          if ($head -ne $csproj) {
              throw "csproj Version ($csproj) and the newest CHANGELOG entry ($head) disagree. " +
                    "A feat: PR bumps the MINOR component and a fix: PR the PATCH — set both to the " +
                    "version the merge will actually tag."
          }
          Write-Host "Version $csproj is consistent across csproj and CHANGELOG."

      # The check above proves csproj and CHANGELOG agree with EACH OTHER. It does not prove they agree
      # with the version the merge will actually tag — a different number, computed by auto-release as a
      # bump from the newest TAG, not from whatever the files say.
      #
      # That gap stranded two versions on 2026-08-11. Several fix: PRs were open at once; each resolved
      # its CHANGELOG conflict by taking the next free number, so main ended up carrying entries for
      # 1.61.4 and 1.61.6 while the newest tag was still v1.61.2. Auto-release computed 1.61.3, found no
      # entry for it, and refused — twice. Its own guard worked (no tag was created, so nothing was left
      # half-published), but the cost landed AFTER the merge and the remedy was another PR.
      #
      # Checking it here turns that into one edit on the PR. Mirrors auto-release's arithmetic
      # deliberately — same tag selection, same bump rules — so the two cannot drift apart on what
      # "next" means.
      - name: Check the version is the one the merge will tag
        shell: bash
        run: |
          set -o pipefail

          MATCHES=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          TAG=${MATCHES%%$'\n'*}
          if [ -z "$TAG" ]; then
            echo "No release tag found — nothing to compute a bump from, skipping."
            exit 0
          fi

          CSPROJ=$(grep -oPm1 '(?<=<Version>)[^<]+' SysManager/SysManager/SysManager.csproj)
          IFS='.' read -r MAJOR MINOR PATCH <<< "${TAG#v}"

          # A PR's commit type is not reliably available here, so accept ANY of the three legal bumps
          # rather than guessing. That still catches the real failure: a version that is not a single
          # bump from the newest tag, which is exactly what "1.61.6 while the tag is v1.61.2" was.
          PATCH_NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          MINOR_NEXT="${MAJOR}.$((MINOR + 1)).0"
          MAJOR_NEXT="$((MAJOR + 1)).0.0"

          if [ "$CSPROJ" = "$PATCH_NEXT" ] || [ "$CSPROJ" = "$MINOR_NEXT" ] || [ "$CSPROJ" = "$MAJOR_NEXT" ]; then
            echo "Version $CSPROJ is a valid bump from $TAG."
            exit 0
          fi

          # Unchanged is fine: docs:/test:/ci:/chore: PRs do not release, so they never touch it.
          if [ "$CSPROJ" = "${TAG#v}" ]; then
            echo "Version $CSPROJ equals the newest tag — no release expected from this PR."
            exit 0
          fi

          echo "::error::Version $CSPROJ is not what this merge will tag. The newest tag is $TAG, so auto-release will compute $PATCH_NEXT (fix:), $MINOR_NEXT (feat:) or $MAJOR_NEXT (breaking). Set csproj Version AND the newest CHANGELOG header to whichever applies. If another PR merged first and took your number, re-resolve against main rather than picking the next free one — a gap makes auto-release fail after the merge instead of before it."
          exit 1

      # The release workflow copies the matching CHANGELOG block VERBATIM into the release body and the
      # auto-posted announcement, so whatever that entry starts with is the first thing a prospective
      # user reads. When the friendly lead was a manual afterthought, five of the biggest feature
      # releases (1.53.0, 1.54.0, 1.55.0, 1.55.1, 1.56.0) shipped opening with a bare semver heading
      # followed by engineering prose — the ones a newcomer is most likely to open.
      #
      # Checked on the PR rather than at release time for the same reason as the version check above:
      # here it costs one edit, there it blocks a release after the tag is already pushed. The release
      # workflow keeps its own copy of this guard as the backstop, since a release can be dispatched
      # manually without passing through this job.
      - name: Check the newest CHANGELOG entry has a plain-English lead
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $head = [regex]::Match($changelog, '(?ms)^## \[(?<ver>[0-9]+\.[0-9]+\.[0-9]+)\].*?(?=^## \[|\z)')
          if (-not $head.Success) { throw "No versioned '## [x.y.z]' entry found in CHANGELOG.md." }

          $version = $head.Groups['ver'].Value
          $afterHeader = ($head.Value -split "(?m)^## \[.*$", 2)[1]
          $beforeFirstCategory = ($afterHeader -split "(?m)^### ", 2)[0]
          # Only real prose counts — blank lines and horizontal rules do not. @() keeps this an array
          # even for a one-line lead, which PowerShell would otherwise unwrap to a bare string.
          $leadLines = @($beforeFirstCategory -split "`r?`n" |
              Where-Object { $_.Trim() -ne "" -and $_.Trim() -notmatch "^(-{3,}|\*{3,}|_{3,})$" })

          if ($leadLines.Count -eq 0) {
              # Built by joining rather than with a here-string: PowerShell requires a here-string's
              # body and its closing "@ at column 0, which terminates the YAML block scalar this script
              # lives in. The two are incompatible, and the result is a workflow that will not parse.
              $msg = @(
                  "The CHANGELOG entry for $version has no plain-English lead."
                  ""
                  "Add one or two sentences directly under the '## [$version]' header, BEFORE the first"
                  "'###' category, describing what changed in the words a user would use. The release"
                  "workflow copies this entry verbatim, so that paragraph becomes the opening line of"
                  "the release page and of the announcement discussion."
                  ""
                  "Example:"
                  ""
                  "  ## [$version] - <date>"
                  ""
                  "  Quick Tune-Up now shows you what it found, instead of throwing the results away."
                  ""
                  "  ### Fixed"
                  "  - ..."
              ) -join [Environment]::NewLine
              throw $msg
          }
          Write-Host "CHANGELOG entry for $version opens with a lead ($($leadLines.Count) line(s))."

      - name: Build (Release)
        run: dotnet build SysManager/SysManager/SysManager.csproj -c Release --no-restore

      - name: Build tests
        run: dotnet build SysManager/SysManager.Tests/SysManager.Tests.csproj -c Release --no-restore

      # Compile-check the integration tests so ViewModel/service signature drift is
      # caught in CI. They are NOT run here (they touch the live system); compilation
      # alone catches the constructor/property mismatches that previously slipped by.
      - name: Build integration tests (compile check)
        run: dotnet build SysManager/SysManager.IntegrationTests/SysManager.IntegrationTests.csproj -c Release --no-restore

      # DIAGNOSING A RED CHECK HERE: read the "Passed! - Failed: N" line in this step's log first.
      # If it says Failed: 0, the tests passed and the JOB was killed — either by the timeout above
      # or by a transient GitHub failure ("Failed to resolve action download info"). A killed job's
      # conclusion is `cancelled`, which `gh pr checks` displays as `fail`, so it looks identical to
      # a broken test. The fix in that case is `gh run rerun <id> --failed`, not a code change.
      - name: Run unit tests
        run: >
          dotnet test SysManager/SysManager.Tests/SysManager.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=unit-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      # Skip Codecov on fork PRs: forked pull requests have no access to repository
      # secrets, so CODECOV_TOKEN is empty there and the upload would fail noisily for
      # no benefit. Same-repo pushes/PRs upload normally.
      - name: Upload coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: TestResults/**/unit-results.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: TestResults/**
          retention-days: 14

  # Catches a version that was never tagged — otherwise INVISIBLE. auto-release.yml serialises on a
  # concurrency group, and GitHub keeps only ONE pending run per group, so merging two
  # release-triggering PRs in close succession can displace the older queued run. A displaced run
  # reports as `cancelled`, not failed, so the bump is silently dropped: main ends up claiming a
  # version that has no tag and no release, with nothing red anywhere. That happened on the #1717
  # merge (1.57.6) and took manual archaeology to find.
  #
  # A separate job on purpose, not a step in build-and-test: it waits for auto-release, which runs in
  # parallel on the same push, and adding minutes of waiting to a job that already runs ~8 of its
  # 10-minute budget would make CI fail for timing rather than for correctness. ubuntu-latest because
  # this is git-only work.
  tag-published:
    name: Merged version is tagged
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # main only: on a PR, csproj is SUPPOSED to be ahead of the newest tag — that is the point of
    # bumping it in the PR. It is only a defect once the merge has landed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tags are the whole point of this job

      - name: Wait for the tag that matches csproj
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oE '<Version>[^<]+' SysManager/SysManager/SysManager.csproj | head -n1 | sed 's/<Version>//')
          echo "csproj version: $VERSION"

          # A chore:/docs:/ci:/test: merge does not release, so csproj legitimately still points at
          # the version already tagged by the previous release-triggering merge. Only a MISSING tag
          # for the current csproj version is a problem, which is exactly what this checks.
          for attempt in $(seq 1 10); do
            git fetch --tags --quiet origin
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "v$VERSION is tagged."
              exit 0
            fi
            echo "attempt $attempt: v$VERSION not tagged yet, waiting for auto-release..."
            sleep 30
          done

          NEWEST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          echo "::error::csproj is at $VERSION but there is no v$VERSION tag (newest is $NEWEST). Auto-release did not tag this merge — check whether its run was CANCELLED rather than failed (a displaced queued run reports as cancelled). Recover with: git tag -a v$VERSION -m \"SysManager $VERSION\" <merge-sha> && git push origin v$VERSION — release.yml triggers on v*.*.* and publishes normally."
          exit 1

  ui-tests:
    name: UI automation tests
    runs-on: windows-latest
    needs: build-and-test
    timeout-minutes: 30
    # UI tests need a desktop session; windows-latest provides one.
    # Skip on PRs from forks, since secrets won't be available anyway.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore SysManager/SysManager/SysManager.csproj
          dotnet restore SysManager/SysManager.UITests/SysManager.UITests.csproj

      # The UI tests launch the real app, so the app itself must be built first.
      # Without this the fixture finds no SysManager.exe and every UI test errors
      # at setup — which the previous Release-only job masked behind continue-on-error.
      - name: Build app (Release)
        run: dotnet build SysManager/SysManager/SysManager.csproj -c Release --no-restore

      - name: Build UI tests
        run: dotnet build SysManager/SysManager.UITests/SysManager.UITests.csproj -c Release

      - name: Run UI tests
        id: ui-tests
        run: >
          dotnet test SysManager/SysManager.UITests/SysManager.UITests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=ui-results.trx"
          --results-directory TestResults
        continue-on-error: true

      # Surface UI test failures as a visible warning annotation. Use `outcome`,
      # NOT `conclusion`: with continue-on-error the step's `conclusion` is forced to
      # 'success', so a `conclusion == 'failure'` check never fires and the failure is
      # masked entirely. `outcome` reflects the real step result before continue-on-error
      # is applied.
      - name: Annotate UI test failures
        if: steps.ui-tests.outcome == 'failure'
        run: echo "::warning::UI automation tests failed — review the ui-test-results artifact for details."

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-test-results
          path: TestResults/**
          retention-days: 14

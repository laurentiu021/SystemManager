version: 2
updates:
  # Keep NuGet packages current (main app + test projects).
  - package-ecosystem: "nuget"
    directory: "/SysManager/SysManager"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group minor+patch bumps into one PR; keep majors separate for careful review.
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/SysManager/SysManager.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "deps(tests)"
      include: "scope"
    ignore:
      # Xunit.StaFact majors target xUnit v3. Verified on 4.0.23 (dependabot PR #2025): it pulls
      # xunit.v3.core alongside this suite's xunit.core 2.9.3, and the "Build tests" step fails with
      # hundreds of CS0433 — "the type 'FactAttribute' exists in both" — because every [Fact] and
      # [Collection] becomes ambiguous.
      #
      # Adopting it is an xUnit v2 -> v3 migration of the whole suite, not a version bump, so it is
      # tracked separately. Without this rule dependabot reopens the same unbuildable PR every Monday.
      # Minor and patch updates inside 1.x are still wanted, which is why this is major-only.
      - dependency-name: "Xunit.StaFact"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/SysManager/SysManager.UITests"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "deps(uitests)"
      include: "scope"
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/SysManager/SysManager.IntegrationTests"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "deps(integration)"
      include: "scope"
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    # Group all action bumps into one PR — they're low-risk and SHA-pinned.
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
